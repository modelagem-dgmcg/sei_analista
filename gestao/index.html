<!DOCTYPE html>

<style>
  :root { --grafite:#1a1d20; --grafite2:#2a2e33; --fundo:#f0f2f5; --texto:#212529; --mudo:#6c757d; --borda:#dee2e6;
          --ambar:#d97706; --bordo:#8e1628; --bordo-claro:#f8d7da; --ok:#198754; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:var(--fundo); color:var(--texto); }
  .hidden { display:none !important; }
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--grafite); }
  .login-box { background:#fff; padding:36px; border-radius:8px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  h1.marca { font-size:1.7rem; text-align:center; margin-bottom:6px; } h1.marca span { color:var(--ambar); }
  .sub { text-align:center; color:var(--mudo); font-size:.8rem; margin-bottom:24px; }
  label { display:block; font-size:.85rem; font-weight:500; color:#495057; margin:12px 0 5px; }
  input, select { width:100%; padding:9px 10px; border:1px solid #ced4da; border-radius:6px; font-size:.9rem; outline:none; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:none; border-radius:6px; cursor:pointer; font-size:.85rem; font-weight:500; background:#e9ecef; color:var(--texto); }
  .btn:hover { background:#dee2e6; } .btn-escuro { background:#5c636a; color:#fff; } .btn-escuro:hover { background:#495057; }
  .erro { background:var(--bordo-claro); color:var(--bordo); padding:10px; border-radius:6px; font-size:.85rem; margin-top:12px; }
  header { background:var(--grafite); color:#f8f9fa; padding:12px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:1.15rem; } header h1 span { color:var(--ambar); }
  header .dir { margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.8rem; color:#adb5bd; }
  header select { width:auto; padding:5px 8px; font-size:.8rem; background:var(--grafite2); color:#f8f9fa; border-color:#495057; }
  nav.abas { background:#fff; border-bottom:1px solid var(--borda); padding:0 24px; display:flex; gap:4px; flex-wrap:wrap; }
  nav.abas a { padding:12px 14px; font-size:.88rem; color:var(--mudo); text-decoration:none; border-bottom:3px solid transparent; }
  nav.abas a.ativa { color:var(--texto); border-bottom-color:var(--ambar); font-weight:600; }
  main { padding:24px; max-width:1400px; margin:0 auto; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-bottom:6px; }
  .num { background:#fff; border:1px solid var(--borda); border-left:4px solid #5c636a; border-radius:8px; padding:14px 16px; }
  .num b { display:block; font-size:1.6rem; line-height:1.1; } .num span { font-size:.76rem; color:var(--mudo); }
  .bloco { background:#fff; border:1px solid var(--borda); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .bloco h2 { font-size:.95rem; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .bloco h2 small { font-weight:400; color:var(--mudo); font-size:.75rem; }
  .tabela { width:100%; border-collapse:collapse; font-size:.82rem; } .rolagem { overflow-x:auto; }
  .tabela th { text-align:left; background:#f8f9fa; color:#495057; font-weight:600; padding:7px 8px; border-bottom:1px solid var(--borda); white-space:nowrap; }
  .tabela td { padding:7px 8px; border-bottom:1px solid #f1f3f5; vertical-align:top; }
  .tabela td.n { text-align:center; } .zero { color:#ced4da; }
  .vazio { color:var(--mudo); font-style:italic; font-size:.85rem; }
  .etq { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.72rem; font-weight:600; background:#e9ecef; color:#495057; }
  .etq.vermelho { background:var(--bordo-claro); color:var(--bordo); } .etq.amarelo { background:#fff3cd; color:#664d03; } .etq.azul { background:#e7f5ff; color:#1864ab; }
  .filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  .filtros > div { min-width:160px; } .filtros label { margin-top:0; }
  .barra { height:14px; background:#e9ecef; border-radius:7px; overflow:hidden; } .barra div { height:100%; background:#5c636a; }
  .barra div.alto { background:var(--bordo); }
  .config-blocos { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; font-size:.8rem; }
  .config-blocos .item { background:#fff; border:1px solid var(--borda); border-radius:6px; padding:4px 8px; display:flex; gap:6px; align-items:center; }
  .config-blocos button { border:none; background:none; cursor:pointer; color:var(--mudo); padding:0 2px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:gira .75s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .janela-fundo { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .janela { background:#fff; border-radius:8px; padding:22px; width:100%; max-width:540px; max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .janela h2 { font-size:1.05rem; margin-bottom:6px; }
  .marcar { display:flex; align-items:center; gap:6px; font-weight:400; margin:6px 0; } .marcar input { width:auto; }
  .ok-msg { background:#d1e7dd; color:#0f5132; padding:8px 12px; border-radius:6px; font-size:.84rem; margin-bottom:12px; }
  .dica { font-size:.76rem; color:var(--mudo); margin-top:4px; }
  footer { text-align:center; font-size:.72rem; color:#adb5bd; padding:20px; }
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <h1 class="marca">SEI <span>Gestão</span></h1>
    <div class="sub">Painel da gestão — acesso restrito a administradores</div>
    <label for="l-usuario">Login institucional</label><input id="l-usuario" placeholder="nome.sobrenome">
    <label for="l-senha">Senha</label><input id="l-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') entrar()">
    <button class="btn btn-escuro" style="width:100%; justify-content:center; margin-top:18px; padding:11px;" onclick="entrar()"><i class="ti ti-login-2"></i> Entrar</button>
    <div id="l-erro" class="erro hidden"></div>
    <div style="text-align:center; margin-top:16px; font-size:.78rem;"><a href="../" style="color:#495057;">Ir para o SEI Analista</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>SEI <span>Gestão</span></h1>
    <div class="dir">
      <label style="margin:0; color:#adb5bd;">Gerência</label>
      <select id="f-gerencia" onchange="recarregar()"><option value="">Todas</option></select>
      <button class="btn" onclick="recarregar()" title="Buscar os dados de novo"><i class="ti ti-refresh"></i> Atualizar</button>
      <span id="quem"></span>
      <button class="btn hidden" id="btn-ir-analista" onclick="irParaOutroApp('analista')" title="Abre o SEI Analista em outra aba, sem pedir a senha de novo"><i class="ti ti-layout-sidebar"></i> Ir para o Analista</button>
      <button class="btn" onclick="sair()"><i class="ti ti-logout"></i> Sair</button>
    </div>
  </header>
  <nav class="abas">
    <a href="#" data-aba="hoje" onclick="abrirAba('hoje'); return false;">Hoje</a>
    <a href="#" data-aba="processos" onclick="abrirAba('processos'); return false;">Processos</a>
    <a href="#" data-aba="achados" onclick="abrirAba('achados'); return false;">Achados</a>
    <a href="#" data-aba="registro" onclick="abrirAba('registro'); return false;">Registro de atividades</a>
    <a href="#" data-aba="banco" onclick="abrirAba('banco'); return false;">Banco de dados</a>
    <a href="#" data-aba="usuarios" onclick="abrirAba('usuarios'); return false;">Usuários e IA</a>
  </nav>
  <main id="conteudo"></main>
  <footer>© 2026 SES-PE — DGMCG/GGPCG. Desenvolvido por <strong>Cleuton Vieira</strong>.<br><span id="rodape-versao"></span></footer>
</div>

<script>
// ============================================================
// SEI GESTÃO — lógica da página
// ============================================================
const VERSAO_GESTAO = 'v1.4';
const VERSAO_GESTAO_DATA = '05/10/2026 13:24';
const API_URL = 'https://script.google.com/macros/s/AKfycbzzcJEAQPUCwY5YC2o1O5bj500pRE2mOFfZrLCy-e2kFzIgoDkebamJBgQK_yV2Ez0b/exec';

let TOKEN = null, usuario = null, versaoServidor = '', abaAtual = 'hoje', painel = null;

// Nomes das ações do registro em linguagem simples
const NOMES_ACOES = {
  ENTROU: 'Entrou', SAIU: 'Saiu', LOGIN_RECUSADO: 'Login recusado', ABRIU_PROCESSO: 'Abriu processo',
  CRIOU_PROCESSO: 'Importou processo', ENCAMINHOU_PROCESSO: 'Encaminhou processo', DEVOLVEU_PROCESSO: 'Devolveu processo',
  FINALIZOU_PROCESSO: 'Finalizou processo', MUDOU_STATUS: 'Mudou status', REMOVEU_PROCESSO: 'Removeu processo',
  IMPORTOU_DOCUMENTO: 'Importou documento', IMPORTOU_VERSAO_ASSINADA: 'Importou versão assinada',
  RODOU_CHECAGEM: 'Rodou checagem', REVISOU_PARECER: 'Revisou parecer', PERGUNTOU_AO_PROCESSO: 'Perguntou ao processo',
  PAROU_ACOMPANHAMENTO: 'Parou de acompanhar', REMOVEU_DOCUMENTO: 'Removeu documento', ARQUIVOU_REGISTRO: 'Arquivou registro antigo',
  CRIOU_ANOTACAO: 'Criou anotação', ENCAMINHOU_ACHADO: 'Encaminhou achado', RESPONDEU_ACHADO: 'Respondeu achado',
  ACAO_RECUSADA: 'Ação recusada', GESTAO_VIU_PAINEL: 'Gestão: viu o painel', GESTAO_CADASTROU_CHAVE_IA: 'Gestão: cadastrou chave de IA', GESTAO_ALTEROU_CHAVE_IA: 'Gestão: alterou chave de IA', GESTAO_REMOVEU_CHAVE_IA: 'Gestão: removeu chave de IA', GESTAO_VIU_ESTATISTICAS: 'Gestão: viu estatísticas',
  GESTAO_VIU_TODOS_OS_ACHADOS: 'Gestão: viu todos os achados', GESTAO_VIU_REGISTRO_DE_ATIVIDADES: 'Gestão: viu o registro',
  GESTAO_CRIOU_USUARIO: 'Gestão: criou usuário', GESTAO_ALTEROU_USUARIO: 'Gestão: alterou usuário',
  GESTAO_REDEFINIU_SENHA: 'Gestão: redefiniu senha', GESTAO_DESBLOQUEOU_LOGIN: 'Gestão: desbloqueou login'
};
const nomeAcao = a => NOMES_ACOES[a] || String(a || '').replace(/_/g, ' ').toLowerCase();

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const $ = id => document.getElementById(id);
const dataHora = d => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const carregando = t => `<div class="vazio"><span class="spinner"></span>${esc(t || 'Carregando...')}</div>`;
const n0 = v => v ? `<b>${v}</b>` : '<span class="zero">0</span>';

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Toda chamada vai por POST com o token no corpo (nunca no endereço).
async function api(acao, corpo) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const r = await fetch(API_URL + '?action=' + encodeURIComponent(acao), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, signal: ctrl.signal,
      body: JSON.stringify(Object.assign({}, corpo || {}, { token: TOKEN }))
    });
    let res;
    try { res = JSON.parse(await r.text()); } catch (e) { return { ok: false, erro: 'O servidor respondeu de um jeito inesperado. Tente de novo em instantes.' }; }
    if (res && res.sessao_expirada && acao !== 'auth/login') { sessaoVencida(); }
    return res || { ok: false, erro: 'Resposta vazia do servidor.' };
  } catch (e) {
    return { ok: false, erro: e.name === 'AbortError' ? 'O servidor demorou demais para responder. Tente de novo.' : 'Sem conexão com o servidor: ' + e.message };
  } finally { clearTimeout(timer); }
}

function sessaoVencida() {
  TOKEN = null; window.__seiLogado = false;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  const e = $('l-erro'); e.textContent = 'Sua sessão venceu. Entre de novo.'; e.classList.remove('hidden');
  if (usuario) $('l-usuario').value = usuario.email;
}

async function entrar() {
  const erro = $('l-erro'); erro.classList.add('hidden');
  const email = $('l-usuario').value.trim(), senha = $('l-senha').value;
  if (!email || !senha) { erro.textContent = 'Preencha login e senha.'; erro.classList.remove('hidden'); return; }
  const res = await api('auth/login', { email, senha_hash: await sha256(senha), app: 'gestao' });
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível entrar.'; erro.classList.remove('hidden'); return; }
  _entrarGestao(res);
}

// Entrada depois que o servidor aceitou: vale para o login com senha e para o passe vindo do SEI Analista.
function _entrarGestao(res) {
  TOKEN = res.token; usuario = res.usuario; versaoServidor = res.versao_backend || '';
  window.__seiLogado = true;
  $('l-senha').value = ''; $('l-erro').classList.add('hidden');
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('quem').textContent = usuario.nome;
  $('rodape-versao').textContent = `Gestão ${VERSAO_GESTAO} · ${VERSAO_GESTAO_DATA} — Servidor ${versaoServidor || 'sem versão (antigo)'}`;
  // "Ir para o Analista" só para quem também tem acesso ao SEI Analista
  const apps = Array.isArray(usuario.apps) ? usuario.apps : [];
  $('btn-ir-analista').classList.toggle('hidden', !apps.includes('analista'));
  abrirAba('hoje');
}

// ==================== TROCA ENTRE OS APPS (passe de uso único) ====================
async function irParaOutroApp(destino) {
  const nomeAba = destino === 'gestao' ? 'sei_gestao' : 'sei_analista';
  const endereco = destino === 'gestao' ? './' : '../';
  let aba = null;
  try { aba = window.open('', nomeAba); } catch (e) { aba = null; }
  try { if (aba && aba.__seiLogado) { aba.focus(); return; } } catch (e) { /* ignora */ }
  const res = await api('auth/ponte-criar', { destino });
  if (!res.ok) {
    try { if (aba && aba.location.href === 'about:blank') aba.close(); } catch (e) { /* ignora */ }
    alert('Não foi possível abrir: ' + (res.erro || 'erro desconhecido'));
    return;
  }
  try { localStorage.setItem('sei_ponte', JSON.stringify({ codigo: res.codigo, destino, criado: Date.now() })); } catch (e) { /* ignora */ }
  if (aba) { aba.location.href = endereco; aba.focus(); } else window.location.href = endereco;
}

async function _entrarComPasse(app) {
  let passe = null;
  try { passe = JSON.parse(localStorage.getItem('sei_ponte') || 'null'); } catch (e) { passe = null; }
  if (!passe || passe.destino !== app) return false;
  try { localStorage.removeItem('sei_ponte'); } catch (e) { /* ignora */ }
  if (Date.now() - Number(passe.criado || 0) > 60000) return false;
  const res = await api('auth/ponte-usar', { codigo: passe.codigo, app });
  if (!res.ok) { const e = $('l-erro'); e.textContent = res.erro || 'Entre com login e senha.'; e.classList.remove('hidden'); return false; }
  _entrarGestao(res);
  return true;
}
window.name = 'sei_gestao';
window.addEventListener('load', () => { _entrarComPasse('gestao'); });

async function sair() {
  await api('auth/logout', {});
  TOKEN = null; usuario = null; painel = null; window.__seiLogado = false;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}

function abrirAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('nav.abas a').forEach(a => a.classList.toggle('ativa', a.dataset.aba === aba));
  ({ hoje: telaHoje, processos: telaProcessos, achados: telaAchados, registro: telaRegistro, banco: telaBanco, usuarios: telaUsuarios })[aba]();
}
function recarregar() { painel = null; abrirAba(abaAtual); }

async function carregarPainel() {
  if (painel) return painel;
  const res = await api('adm/painel', { gerencia: $('f-gerencia').value, dias_parado: Number(localStorage.getItem('gestao_dias_parado')) || 7 });
  if (!res.ok) throw new Error(res.erro || 'Não foi possível carregar o painel.');
  const sel = $('f-gerencia'), atual = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' + res.gerencias.map(g => `<option ${g === atual ? 'selected' : ''}>${esc(g)}</option>`).join('');
  painel = res;
  return res;
}

// ==================== ABA HOJE (blocos que o gestor escolhe e ordena) ====================
const BLOCOS = {
  resumo:    { nome: 'Resumo',                  montar: blocoResumo },
  equipe:    { nome: 'Caixas da equipe',        montar: blocoEquipe },
  parados:   { nome: 'Processos parados',       montar: blocoParados },
  perguntas: { nome: 'Perguntas sem resposta',  montar: blocoPerguntas },
  alertas:   { nome: 'Alertas',                 montar: blocoAlertas },
  atividade: { nome: 'Atividade de hoje',       montar: blocoAtividade }
};
function arrumacao() {
  let a;
  try { a = JSON.parse(localStorage.getItem('gestao_blocos') || 'null'); } catch (e) { a = null; }
  const todos = Object.keys(BLOCOS);
  if (!Array.isArray(a)) a = todos.map(id => ({ id, ver: true }));
  a = a.filter(b => BLOCOS[b.id]);
  todos.forEach(id => { if (!a.some(b => b.id === id)) a.push({ id, ver: true }); });
  return a;
}
function salvarArrumacao(a) { localStorage.setItem('gestao_blocos', JSON.stringify(a)); telaHoje(); }
function alternarBloco(id) { const a = arrumacao(); const b = a.find(x => x.id === id); b.ver = !b.ver; salvarArrumacao(a); }
function moverBloco(id, dir) {
  const a = arrumacao(); const i = a.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; salvarArrumacao(a);
}

async function telaHoje() {
  const c = $('conteudo');
  c.innerHTML = carregando('Montando o painel...');
  let p;
  try { p = await carregarPainel(); } catch (e) { c.innerHTML = `<div class="erro">${esc(e.message)}</div>`; return; }
  const arr = arrumacao();
  const config = `<div class="config-blocos"><span style="color:var(--mudo); align-self:center;">Blocos:</span>` + arr.map(b => `
    <div class="item"><label style="margin:0; display:flex; gap:4px; align-items:center; font-weight:400; cursor:pointer;">
      <input type="checkbox" style="width:auto;" ${b.ver ? 'checked' : ''} onchange="alternarBloco('${b.id}')"> ${esc(BLOCOS[b.id].nome)}</label>
      <button title="Subir" onclick="moverBloco('${b.id}',-1)"><i class="ti ti-chevron-up"></i></button><button title="Descer" onclick="moverBloco('${b.id}',1)"><i class="ti ti-chevron-down"></i></button></div>`).join('') + `</div>`;
  const cab = `<div style="font-size:.75rem; color:var(--mudo); margin-bottom:10px;">Dados de ${dataHora(p.gerado_em)}${p.filtro_gerencia ? ' · gerência ' + esc(p.filtro_gerencia) : ' · todas as gerências'}. Clique em "Atualizar" para buscar de novo.</div>`;
  c.innerHTML = cab + config + arr.filter(b => b.ver).map(b => BLOCOS[b.id].montar(p)).join('');
}

function blocoResumo(p) {
  const st = p.por_status, q = p.qualidade;
  const cartao = (rotulo, v, cor) => `<div class="num" style="border-left-color:${cor || '#5c636a'};"><b>${v || 0}</b><span>${esc(rotulo)}</span></div>`;
  return `<div class="bloco"><h2><i class="ti ti-layout-dashboard"></i> Resumo</h2><div class="grade">
    ${cartao('Processos no total', q.total_processos)}
    ${cartao('Aguardando revisão inicial', st['Aguardando Revisão Inicial'], '#0b509e')}
    ${cartao('Em análise', st['Em Análise'], '#6f42c1')}
    ${cartao('Aguardando revisão final', st['Aguardando Revisão Final'], '#6f42c1')}
    ${cartao('Pronto para assinar', st['Pronto para Assinar no SEI'], '#198754')}
    ${cartao('Concluídos', st['Concluído'], '#198754')}
    ${cartao('Sem nenhuma checagem', q.sem_checagem, q.sem_checagem ? '#8e1628' : '')}

    <label>Acesso aos aplicativos</label>
    <label class="marcar"><input type="checkbox" id="fu-app-analista" ${lista.includes('analista') ? 'checked' : ''}> SEI Analista</label>
    <label class="marcar"><input type="checkbox" id="fu-app-gestao" ${lista.includes('gestao') ? 'checked' : ''}> SEI Gestão <span class="dica" style="margin:0;">(só administradores)</span></label>
    ${u ? `<label class="marcar" style="margin-top:12px;"><input type="checkbox" id="fu-ativo" ${u.ativo ? 'checked' : ''}> Ativo (desmarque para cortar o acesso, mantendo o histórico)</label>`
        : `<label>Senha inicial</label><input id="fu-senha" value="${SENHA_TESTE_PADRAO}"><div class="dica">Senha de teste. Antes do uso real, cada pessoa deve ter a sua.</div>`}
    ${secaoIAHtml(u ? u.login : '')}
    <div id="fu-erro" class="erro hidden"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn" onclick="fecharJanela()">Cancelar</button>
      <button class="btn btn-escuro" id="fu-salvar" onclick="salvarUsuario(${u ? u.id : 0})"><i class="ti ti-check"></i> Salvar</button>
    </div></div>`;
  document.body.appendChild(fundo);
  ajustarAcessoGestao();
  (u ? $('fu-nome') : $('fu-nome')).focus();
}

function ajustarAcessoGestao() {
  const admin = $('fu-perfil').value === 'admin', cx = $('fu-app-gestao');
  cx.disabled = !admin;
  if (!admin) cx.checked = false;
}
function fecharJanela() { $('janela-usuario')?.remove(); }

async function salvarUsuario(id) {
  const erro = $('fu-erro'); erro.classList.add('hidden');
  const perfil = $('fu-perfil').value;
  const marcados = [$('fu-app-analista').checked ? 'analista' : null, $('fu-app-gestao').checked ? 'gestao' : null].filter(Boolean);
  if (!marcados.length) { erro.textContent = 'Marque pelo menos um aplicativo.'; erro.classList.remove('hidden'); return; }
  // Se o acesso marcado é o padrão do perfil, grava vazio (padrão); senão grava a lista.
  const padrao = perfil === 'admin' ? 'analista,gestao' : 'analista';
  const corpo = { nome_usuario: $('fu-nome').value.trim(), gerencia_usuario: $('fu-gerencia').value.trim(), perfil_usuario: perfil,
    apps_usuario: marcados.join(',') === padrao ? '' : marcados.join(',') };
  corpo.ia_escolhas = escolhasIA();
  if (id) { corpo.id_usuario = id; corpo.ativo_usuario = $('fu-ativo').checked; }
  else {
    corpo.login_usuario = $('fu-login').value.trim().toLowerCase();
    const senha = $('fu-senha').value;
    if (!senha) { erro.textContent = 'Informe a senha inicial.'; erro.classList.remove('hidden'); return; }
    corpo.senha_hash_usuario = await sha256(senha);
  }
  const btn = $('fu-salvar'); btn.disabled = true;
  const res = await api('adm/usuarios-salvar', corpo);
  btn.disabled = false;
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível salvar.'; erro.classList.remove('hidden'); return; }
  fecharJanela();
  _avisoUsuarios = res.criado ? `Usuário ${res.usuario.login} criado.`
    : `Alterações de ${res.usuario.login} salvas.` + (res.sessoes_encerradas ? ' A pessoa estava logada e vai precisar entrar de novo.' : '');
  if (res.ia_resumo) _avisoUsuarios += ' IA: ' + res.ia_resumo + '.';
  painel = null; telaUsuarios();
}

async function redefinirSenha(id) {
  const u = _usuarios.find(x => x.id === id);
  const nova = prompt(`Nova senha para ${u.nome} (${u.login}):`, SENHA_TESTE_PADRAO);
  if (nova === null) return;
  if (!nova) return alert('A senha não pode ficar vazia.');
  const res = await api('adm/usuarios-senha', { id_usuario: id, senha_hash_usuario: await sha256(nova) });
  if (!res.ok) return alert('A senha NÃO foi trocada: ' + (res.erro || ''));
  _avisoUsuarios = `Senha de ${u.login} redefinida.` + (res.sessoes_encerradas ? ' A pessoa estava logada e vai precisar entrar de novo.' : '');
  telaUsuarios();
}

async function desbloquear(id) {
  const u = _usuarios.find(x => x.id === id);
  const res = await api('adm/usuarios-desbloquear', { id_usuario: id });
  if (!res.ok) return alert('Não foi possível liberar: ' + (res.erro || ''));
  _avisoUsuarios = `Login ${u.login} liberado; a pessoa já pode tentar de novo.`;
  telaUsuarios();
}

// ==================== IA DE CADA PESSOA (dentro de Usuários) ====================
// As chaves ficam guardadas no servidor; a tela nunca recebe a chave completa, só o final.
let _chaves = [], _chavesUsuarios = [], _servicosIA = {};

function _chaveValePara(k, login) {
  if (!k.ativa) return false;
  if (k.para === '*') return !(k.exceto || []).includes(login);
  return Array.isArray(k.para) && k.para.includes(login);
}
// Chave que a pessoa usa em cada serviço (se houver mais de uma, vale a de menor ordem)
function _chaveDe(login, servico) {
  return _chaves.filter(k => k.servico === servico && _chaveValePara(k, login)).sort((a, b) => a.ordem - b.ordem)[0] || null;
}
function iaDaPessoaHtml(login) {
  const servicos = Object.keys(_servicosIA).filter(s => _chaveDe(login, s));
  return servicos.length
    ? servicos.map(s => { const k = _chaveDe(login, s); return `<span class="etq azul" style="margin:0 4px 4px 0;" title="${esc(k.rotulo)} ••••${esc(k.final)}">${esc(_servicosIA[s])}</span>`; }).join('')
    : '<span class="zero">sem IA</span>';
}

// Seção "IA desta pessoa" da janela de cadastro
function secaoIAHtml(login) {
  const linhas = Object.entries(_servicosIA).map(([s, nome]) => {
    const atual = login ? _chaveDe(login, s) : (_chaves.filter(k => k.servico === s && k.ativa && k.para === '*').sort((a, b) => a.ordem - b.ordem)[0] || null);
    const opcoes = _chaves.filter(k => k.servico === s).map(k => `<option value="${esc(k.id)}" ${atual && atual.id === k.id ? 'selected' : ''}>${esc(k.rotulo)} ••••${esc(k.final)}${k.para === '*' ? ' (geral)' : ''}${k.ativa ? '' : ' (suspensa)'}</option>`).join('');
    return `<div style="display:grid; grid-template-columns:110px 1fr; gap:6px 10px; align-items:center; margin-bottom:8px;">
      <b style="font-size:.85rem;">${esc(nome)}</b>
      <select id="fia-${s}" onchange="$('fia-nova-${s}').style.display = this.value === '__nova' ? 'grid' : 'none'">
        <option value="__nenhum" ${atual ? '' : 'selected'}>Sem acesso</option>${opcoes}<option value="__nova">Cadastrar uma chave nova…</option></select>
      <div id="fia-nova-${s}" style="display:none; grid-column:2; grid-template-columns:1fr 1fr; gap:6px;">
        <input id="fia-chave-${s}" type="password" autocomplete="off" placeholder="Cole a chave de ${esc(nome)}">
        <input id="fia-rotulo-${s}" placeholder="Nome para lembrar (opcional)"></div>
    </div>`;
  }).join('');
  return `<label style="margin-top:14px;">IA desta pessoa</label>
    <div style="border:1px solid var(--borda); border-radius:6px; padding:10px 12px;">${linhas}
      <div class="dica" style="margin:4px 0 0;">Chaves da mesma conta dividem o mesmo limite de uso. Para a pessoa ter a própria cota, cadastre uma chave de outra conta.</div></div>`;
}
function escolhasIA() {
  const e = {};
  Object.keys(_servicosIA).forEach(s => {
    const v = $('fia-' + s)?.value;
    if (!v) return;
    if (v === '__nenhum') e[s] = { modo: 'nenhum' };
    else if (v === '__nova') e[s] = { modo: 'nova', chave: $('fia-chave-' + s).value.trim(), rotulo: $('fia-rotulo-' + s).value.trim() };
    else e[s] = { modo: 'existente', id: v };
  });
  return e;
}

// Quadro das chaves (tarefas que são da chave, não da pessoa)
function painelChavesHtml() {
  const nomeDe = e => (_chavesUsuarios.find(u => u.email === e) || {}).nome || e;
  const quem = k => k.para === '*'
    ? 'Todos' + ((k.exceto || []).length ? ` <span style="color:var(--mudo);">(menos ${k.exceto.length})</span>` : '')
    : (k.para.length ? k.para.map(e => esc(nomeDe(e))).join(', ') : '<span class="zero">ninguém</span>');
  return `<div class="bloco">
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
      <h2 style="margin:0;"><i class="ti ti-key"></i> Chaves de IA cadastradas <small>${_chaves.length}</small></h2>
      <button class="btn" style="margin-left:auto;" onclick="formChave('')"><i class="ti ti-plus"></i> Chave geral (para todos)</button></div>
    <div class="dica" style="margin:0 0 10px;">Chaves de uma pessoa só são cadastradas na janela dela. Aqui você troca uma chave vencida (vale para todos que a usam), suspende, apaga e define a ordem de tentativa.</div>
    ${_chaves.length ? `<div class="rolagem"><table class="tabela"><tr><th>Ordem</th><th>Serviço</th><th>Chave</th><th>Quem usa</th><th>Situação</th><th></th></tr>` +
      _chaves.map(k => `<tr style="${k.ativa ? '' : 'opacity:.55;'}"><td class="n"><b>${k.ordem}</b></td>
        <td><b>${esc(k.servico_nome)}</b><br><span style="color:var(--mudo); font-size:.75rem;">${esc(k.rotulo)}</span></td>
        <td><span style="font-family:monospace;">••••${esc(k.final)}</span></td><td>${quem(k)}</td>
        <td>${k.ativa ? '<span class="etq azul">Ativa</span>' : '<span class="etq">Suspensa</span>'}</td>
        <td style="white-space:nowrap;"><button class="btn" title="Editar" onclick="formChave('${esc(k.id)}')"><i class="ti ti-pencil"></i></button>
          <button class="btn" title="Apagar" onclick="removerChave('${esc(k.id)}')"><i class="ti ti-trash"></i></button></td></tr>`).join('') + '</table></div>'
      : '<div class="vazio">Nenhuma chave cadastrada ainda. Cadastre na janela de cada pessoa ou crie uma chave geral.</div>'}
  </div>`;
}

function formChave(id) {
  const k = id ? _chaves.find(x => x.id === id) : null;
  const geral = !k || k.para === '*';
  const fundo = document.createElement('div');
  fundo.className = 'janela-fundo'; fundo.id = 'janela-chave';
  fundo.innerHTML = `<div class="janela">
    <h2>${k ? 'Editar chave' : 'Nova chave geral'}</h2>
    <label>Serviço</label><select id="fk-servico" ${k ? 'disabled' : ''}>${Object.entries(_servicosIA).map(([v, n]) => `<option value="${v}" ${k && k.servico === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <label>Nome para lembrar</label><input id="fk-rotulo" value="${esc(k ? k.rotulo : '')}" placeholder="ex.: DeepSeek da GGPCG">
    <label>${k ? 'Trocar a chave (opcional)' : 'Chave'}</label><input id="fk-chave" type="password" autocomplete="off" placeholder="${k ? 'Deixe em branco para manter a atual (final ' + esc(k.final) + ')' : 'Cole a chave do serviço'}">
    <div class="dica">Depois de salva, a chave não aparece mais aqui; só os 4 últimos caracteres.</div>
    <label>Ordem de tentativa</label><select id="fk-ordem">${[1, 2, 3, 4, 5, 6].map(n => `<option ${(k ? k.ordem : 1) === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${k ? `<label class="marcar" style="margin-top:12px;"><input type="checkbox" id="fk-geral" ${geral ? 'checked' : ''}> Vale para todos os usuários</label>
      <div class="dica">Desmarcado, a chave vale só para as pessoas escolhidas no cadastro de cada uma.</div>` : '<div class="dica" style="margin-top:10px;">Uma chave geral vale para todos os usuários, menos quem você marcar como "Sem acesso" no cadastro.</div>'}
    <label class="marcar" style="margin-top:10px;"><input type="checkbox" id="fk-ativa" ${!k || k.ativa ? 'checked' : ''}> Ativa (desmarque para suspender sem apagar)</label>
    <div id="fk-erro" class="erro hidden"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button class="btn" onclick="$('janela-chave')?.remove()">Cancelar</button>
      <button class="btn btn-escuro" id="fk-salvar" onclick="salvarChave('${k ? esc(k.id) : ''}')"><i class="ti ti-check"></i> Salvar</button>
    </div></div>`;
  document.body.appendChild(fundo);
}

async function salvarChave(id) {
  const erro = $('fk-erro'); erro.classList.add('hidden');
  const k = id ? _chaves.find(x => x.id === id) : null;
  const geral = k ? $('fk-geral').checked : true;
  const para = geral ? '*' : (k && Array.isArray(k.para) ? k.para : []);
  const botao = $('fk-salvar'); botao.disabled = true;
  const res = await api('adm/chaves-salvar', { id: id || '', servico: k ? k.servico : $('fk-servico').value, rotulo: $('fk-rotulo').value.trim(),
    chave: $('fk-chave').value.trim(), ordem: Number($('fk-ordem').value), para, ativa: $('fk-ativa').checked });
  botao.disabled = false;
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível salvar.'; erro.classList.remove('hidden'); return; }
  $('janela-chave')?.remove();
  telaUsuarios();
}

async function removerChave(id) {
  const k = _chaves.find(x => x.id === id);
  if (!k || !confirm(`Apagar a chave ${k.servico_nome} "${k.rotulo}" (final ${k.final})? Quem usa essa chave fica sem esse serviço no próximo login.`)) return;
  const res = await api('adm/chaves-remover', { id });
  if (!res.ok) { alert(res.erro || 'Não foi possível apagar.'); return; }
  telaUsuarios();
}
</script>
</body>
</html>
