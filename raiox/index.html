  :root { --noite:#212529; --noite2:#343a40; --acento:#b45309; --acento-claro:#fdf0e0; }

</style>

<body>
<div id="login">
  <div class="login-box">
    <h1 class="marca"><span>Raio-X</span></h1>
    <div class="sub">Escrutínio geral da base de documentos — acesso restrito</div>
    <label for="l-usuario">Login institucional</label><input id="l-usuario" placeholder="nome.sobrenome">
    <label for="l-senha">Senha</label><input id="l-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') entrar()">
    <button class="btn btn-principal" style="width:100%; justify-content:center; margin-top:18px; padding:11px;" onclick="entrar()"><i class="ti ti-login-2"></i> Entrar</button>
    <div id="l-erro" class="erro hidden"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1><span>Raio-X</span></h1>
    <div class="dir"><span id="quem"></span><button class="btn btn-sm" onclick="sair()"><i class="ti ti-logout"></i> Sair</button></div>
  </header>
  <nav class="abas">
    <a href="#" id="aba-rodar" onclick="abrirAba('rodar'); return false;">Rodar</a>
    <a href="#" id="aba-achados" onclick="abrirAba('achados'); return false;">Achados</a>
    <a href="#" id="aba-rx" onclick="abrirAba('rx'); return false;">Raio-X para a diretoria</a>
  </nav>
  <main id="conteudo"></main>
  <footer>© 2026 SES-PE — DGMCG/GGPCG. Desenvolvido por <strong>Cleuton Vieira</strong>.<br><span id="rodape-versao"></span></footer>
</div>

<script>
// ============================================================
// RAIO-X — lógica da página
// ============================================================
const VERSAO_RAIOX = 'v0.3';
const VERSAO_RAIOX_DATA = '15/10/2026 12:40';
const API_URL = 'https://script.google.com/macros/s/AKfycbzzcJEAQPUCwY5YC2o1O5bj500pRE2mOFfZrLCy-e2kFzIgoDkebamJBgQK_yV2Ez0b/exec';
const JANELAS_MAX = 8;           // por escopo (cada janela ~110 mil caracteres)
const CHUNK_IA = 30000;          // caracteres por chamada à IA

let TOKEN = null, usuario = null, abaAtual = 'rodar';
let escopos = [], achados = [], chaves = [], parar = false, rodando = false;

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const dorme = ms => new Promise(r => setTimeout(r, ms));
async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function api(acao, corpo, tempoMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), tempoMs || 120000);
  try {
    const r = await fetch(API_URL + '?action=' + encodeURIComponent(acao), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, signal: ctrl.signal,
      body: JSON.stringify(Object.assign({}, corpo || {}, { token: TOKEN }))
    });
    let res;
    try { res = JSON.parse(await r.text()); } catch (e) { return { ok: false, erro: 'O servidor respondeu de um jeito inesperado. Tente de novo em instantes.' }; }
    if (res && res.sessao_expirada && acao !== 'auth/login') sessaoVencida();
    return res || { ok: false, erro: 'Resposta vazia do servidor.' };
  } catch (e) {
    return { ok: false, erro: e.name === 'AbortError' ? 'O servidor demorou demais para responder.' : 'Sem conexão com o servidor: ' + e.message };
  } finally { clearTimeout(timer); }
}
function sessaoVencida() {
  TOKEN = null; parar = true;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  const e = $('l-erro'); e.textContent = 'Sua sessão venceu. Entre de novo.'; e.classList.remove('hidden');
  if (usuario) $('l-usuario').value = usuario.email;
}
async function entrar() {
  const erro = $('l-erro'); erro.classList.add('hidden');
  const email = $('l-usuario').value.trim(), senha = $('l-senha').value;
  if (!email || !senha) { erro.textContent = 'Preencha login e senha.'; erro.classList.remove('hidden'); return; }
  const res = await api('auth/login', { email, senha_hash: await sha256(senha), app: 'raiox' });
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível entrar.'; erro.classList.remove('hidden'); return; }
  TOKEN = res.token; usuario = res.usuario;
  $('l-senha').value = ''; $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('quem').textContent = usuario.nome;
  $('rodape-versao').textContent = `Raio-X ${VERSAO_RAIOX} · ${VERSAO_RAIOX_DATA} — Servidor ${res.versao_backend || 'sem versão'}`;
  const r = await api('ia/minhas-chaves', {});
  chaves = (r && r.ok && r.chaves) || [];
  abrirAba('rodar');
}
async function sair() { try { await api('auth/logout', {}); } catch (e) {} TOKEN = null; location.reload(); }

// ==================== ABAS ====================
function abrirAba(a) {
  abaAtual = a;
  ['rodar', 'achados', 'rx'].forEach(x => $('aba-' + x).classList.toggle('ativa', x === a));
  if (a === 'rodar') telaRodar(); else if (a === 'achados') telaAchados(); else telaRx();
}
const carregando = t => `<div class="vazio"><span class="spinner"></span>${esc(t || 'Carregando...')}</div>`;

// ==================== IA (chamada pelo navegador, com as chaves da Gestão) ====================
const DADOS_PROV = {
  gemini: { url: k => `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${k}`, modelo: 'gemini-3.6-flash' },
  groq: { url: () => 'https://api.groq.com/openai/v1/chat/completions', modelo: 'llama-3.3-70b-versatile' },
  kimi: { url: () => 'https://api.moonshot.ai/v1/chat/completions', modelo: 'kimi-k2.6', espera: 240000 },
  openrouter: { url: () => 'https://openrouter.ai/api/v1/chat/completions', modelo: 'openrouter/free' },
  deepseek: { url: () => 'https://api.deepseek.com/v1/chat/completions', modelo: 'deepseek-chat' }
};
async function chamarProvedor(servico, chave, prompt) {
  const d = DADOS_PROV[servico]; if (!d) throw new Error('serviço desconhecido');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), d.espera || 120000);
  try {
    let resp, txt;
    if (servico === 'gemini') {
      resp = await fetch(d.url(chave), { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json' } }) });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
      const j = await resp.json(); txt = j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('');
    } else {
      const body = { model: d.modelo, messages: [{ role: 'user', content: prompt }], response_format: { type: 'json_object' } };
      if (servico !== 'kimi') body.temperature = 0.1;
      resp = await fetch(d.url(), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + chave }, signal: ctrl.signal, body: JSON.stringify(body) });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
      const j = await resp.json(); txt = j.choices?.[0]?.message?.content;
    }
    if (!txt) throw new Error('sem conteúdo');
    return txt.replace(/```json/g, '').replace(/```/g, '').trim();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'sem resposta no prazo' : e.message); }

let _provedorAtual = '';
async function perguntarIA(prompt, log) {

// ==================== MÁSCARA (mesma função do servidor) ====================
function docsMascarar_(texto, nomesExtra) {
  let txt = String(texto || ''), n = 0;
  const por = {};
  const conta = marca => { n++; por[marca] = (por[marca] || 0) + 1; };
  const troca = (re, marca) => { txt = txt.replace(re, () => { conta(marca); return marca; }); };
  const trocaComRotulo = (re, marca) => { txt = txt.replace(re, (m, rotulo) => { conta(marca); return rotulo + marca; }); };

  // 1) bloco de qualificação do representante: da âncora até o fim da frase (no máximo 220 caracteres)
  const ANC = /(neste\s+ato\s+representad[oa]\s+por|representad[oa]\s+neste\s+ato\s+por|por\s+seu[a]?\s+representante\s+legal[,:]?)/gi;
  let saida = '', pos = 0, m;
  while ((m = ANC.exec(txt))) {
    const ini = m.index + m[0].length, resto = txt.substr(ini, 220), k = resto.search(/[.;]\s/), tam = k >= 0 ? k : resto.length;
    if (tam < 3) { ANC.lastIndex = ini; continue; }
    saida += txt.slice(pos, ini) + ' [REPRESENTANTE]'; pos = ini + tam; ANC.lastIndex = pos; conta('[REPRESENTANTE]');
  }
  txt = saida + txt.slice(pos);

  // 2) documentos e contatos
  troca(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g, '[CPF]');
  trocaComRotulo(/(\bCPF\b[^\d\n]{0,12})\d{11}\b/gi, '[CPF]');
  troca(/\b\d{1,2}\.\d{3}\.\d{3}-[\dxX]\b/g, '[RG]');
  trocaComRotulo(/((?:\bRG\b|\bidentidade\b)[^\d\n]{0,15})[\d][\d.\-xX]{4,13}/gi, '[RG]');
  troca(/[\w.+-]+@[\w-]+\.[\w.-]+/g, '[E-MAIL]');
  troca(/\+55\s?\(?\d{2}\)?\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  troca(/\(\d{2}\)\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  trocaComRotulo(/((?:\btel(?:efone)?\b\.?|\bcel(?:ular)?\b\.?|\bfone\b)[^\d\n]{0,8})\d{2}\s?9?\d{4}-?\d{4}\b/gi, '[TELEFONE]');
  troca(/\b(?:ag[êe]ncia|conta\s+corrente|conta\s+poupan[çc]a|conta\s+banc[áa]ria|c\/c)\s*(?:n[º°o.]*)?\s*:?\s*\d{3,10}(?:-\d)?\b/gi, '[DADO BANCÁRIO]');
  troca(/\bmatr[íi]cula\s*(?:n[º°o.]*)?\s*:?\s*\d[\d.\-]{3,11}\b/gi, '[MATRÍCULA]');

  // 3) nomes que a pessoa pediu para mascarar neste documento
  (nomesExtra || []).forEach(nome => {
    const t = String(nome || '').trim();
    if (t.length < 3) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'), 'gi');
    troca(re, '[NOME]');
  });
  return { texto: txt, trocas: n, por_tipo: por };
}

async function rodarPendentes(tipo) {

  if (!fila.length) { prog('Não há ' + (tipo === 'contrato' ? 'contratos' : 'processos') + ' pendentes.'); return; }
  parar = false; rodando = true; desenharRodar(escopos.reduce((s, e) => s + e.n_docs, 0));
  let i = 0;
  for (const e of fila) {
    if (parar) break; i++;
    prog(`<span class="spinner"></span>${i} de ${fila.length}: ${esc(e.rotulo)}`);

async function rodarUm(id) {

  parar = false; rodando = true; desenharRodar(escopos.reduce((s, x) => s + x.n_docs, 0));
  prog(`<span class="spinner"></span>${esc(e.rotulo)}`);

async function rodarEscopo(e) {
  logar('▶ ' + e.rotulo);
  const todos = []; let inicio = 0, janelas = 0, total = 0, lido = 0, parcial = false, modelo = '';
  while (inicio !== null && janelas < JANELAS_MAX) {
    if (parar) { parcial = true; break; }
    const pk = await api('raiox/pacote', { escopo: e.escopo, inicio });
    if (pk.ok === false) { logar('  erro: ' + pk.erro); parcial = true; break; }
    total = pk.total_chars; lido = pk.fim; janelas++;
    const masc = docsMascarar_(pk.texto, []).texto;
    for (let i = 0; i < masc.length; i += CHUNK_IA) {
      if (parar) { parcial = true; break; }
      const parte = masc.slice(i, i + CHUNK_IA);
      try {
        const bruto = await perguntarIA(montarPrompt(e.rotulo, parte), logar);
        modelo = _provedorAtual;
        let j; try { j = JSON.parse(bruto); } catch (x) { logar('  resposta fora do formato; trecho ignorado'); continue; }
        (Array.isArray(j) ? j : (j.achados || [])).forEach(a => {
          if (!a || !a.titulo) return;
          const confere = a.trecho && normT(parte).includes(normT(a.trecho)) ? 'sim' : (a.trecho ? 'nao' : '');
          todos.push(Object.assign({}, a, { trecho_confere: confere, setor: setorValido(a.setor) }));
        });
      } catch (x) { logar('  ' + x.message.slice(0, 200)); parcial = true; break; }
    }
    if (parcial) break;
    inicio = pk.proximo;
  }
  if (inicio !== null && !parcial) parcial = true;       // sobrou texto além do limite de janelas
  const vistos = {}, unicos = todos.filter(a => { const k = normT(a.titulo); if (vistos[k]) return false; vistos[k] = 1; return true; });
  const s = await api('raiox/salvar', { escopo: e.escopo, achados: unicos, parcial, lido_chars: lido, total_chars: total, modelo });
  logar(s.ok === false ? '  não salvou: ' + s.erro : `  ${unicos.length} achados guardados${parcial ? ' (leitura parcial: ' + fmt(lido) + ' de ' + fmt(total) + ' caracteres)' : ''}`);
  const x = escopos.find(z => z.escopo === e.escopo); if (x && s.ok !== false) { x.estado = parcial ? 'parcial' : 'concluido'; x.n_achados = unicos.length; }
}

// ==================== TELA: ACHADOS ====================
async function telaAchados() {
  $('conteudo').innerHTML = carregando('Carregando os achados...');
  const r = await api('raiox/achados', {});
  if (!r.ok && r.erro) { $('conteudo').innerHTML = `<div class="erro">${esc(r.erro)}</div>`; return; }
  achados = r.achados || [];
  const opt = (campo) => [...new Set(achados.map(a => a[campo]).filter(Boolean))].sort().map(v => `<option>${esc(v)}</option>`).join('');
  $('conteudo').innerHTML = `
    <div class="bloco"><h2><i class="ti ti-list-search"></i> Achados <small id="cont-ach"></small></h2>
      <div class="filtros">
        <div><label>Unidade</label><select id="f-unidade" onchange="pintarAchados()"><option value="">Todas</option>${opt('unidade')}</select></div>
        <div><label>Gravidade</label><select id="f-grav" onchange="pintarAchados()"><option value="">Todas</option><option>alta</option><option>media</option><option>baixa</option></select></div>
        <div><label>Origem</label><select id="f-orig" onchange="pintarAchados()"><option value="">Todas</option><option value="codigo">Código</option><option value="ia">IA</option></select></div>
        <div><label>Setor</label><select id="f-setor" onchange="pintarAchados()"><option value="">Todos</option>${nomesSetores().map(n => `<option>${esc(n)}</option>`).join('')}<option value="__sem">Sem setor</option></select></div>
        <div><label>Tipo</label><select id="f-tipo" onchange="pintarAchados()"><option value="">Todos</option>${opt('tipo')}</select></div>
        <div><label>Conferência</label><select id="f-conf" onchange="pintarAchados()"><option value="">Todas</option><option value="sim">Conferido: sim</option><option value="nao">Conferido: não (não procede)</option><option value="pend">A conferir</option></select></div>
        <div><label>Busca</label><input id="f-q" placeholder="palavra" oninput="pintarAchados()"></div>
      </div></div>
    <div id="lista-ach"></div>`;
  pintarAchados();
}
const ordemGrav = { alta: 0, media: 1, baixa: 2 };
function filtrados() {
  const v = id => ($(id) || {}).value || '';
  const q = normT(v('f-q'));
  return achados.filter(a => (!v('f-unidade') || a.unidade === v('f-unidade')) && (!v('f-grav') || a.gravidade === v('f-grav')) && (!v('f-orig') || a.origem === v('f-orig')) &&
    (!v('f-setor') || (v('f-setor') === '__sem' ? !a.setor : a.setor === v('f-setor'))) && (!v('f-tipo') || a.tipo === v('f-tipo')) && (!v('f-conf') || (v('f-conf') === 'pend' ? !a.conferido : a.conferido === v('f-conf'))) &&
    (!q || normT([a.titulo, a.descricao, a.unidade, a.contrato, a.documentos].join(' ')).includes(q)))
    .sort((x, y) => (ordemGrav[x.gravidade] - ordemGrav[y.gravidade]) || String(x.unidade).localeCompare(String(y.unidade), 'pt-BR'));
}
function pintarAchados() {
  const lista = filtrados(); $('cont-ach').textContent = `${lista.length} de ${achados.length}`;
  $('lista-ach').innerHTML = lista.slice(0, 300).map(a => cartao(a, true)).join('') + (lista.length > 300 ? '<div class="dica">Mostrando os 300 primeiros. Use os filtros.</div>' : '') || '<div class="vazio">Nenhum achado com esse filtro.</div>';
}
function cartao(a, comBotoes) {
  const conf = a.conferido === 'sim' ? '<span class="etq verde">conferido: procede</span>' : a.conferido === 'nao' ? '<span class="etq vermelho">conferido: não procede</span>' : '<span class="etq amarelo">a conferir</span>';
  const trechoAviso = a.origem === 'ia' && a.trecho_confere === 'nao' ? ' <span class="etq vermelho">trecho não encontrado no texto</span>' : '';
  return `<div class="card-ach ${esc(a.gravidade)}" id="ach-${esc(a.id)}">
    <div><span class="sev ${esc(a.gravidade)}">${esc(a.gravidade)}</span> <span class="etq">${a.origem === 'ia' ? 'IA' : 'código'}</span> <span class="etq azul">${esc(a.tipo)}</span> ${conf}${trechoAviso}
      <span class="dica" style="margin-left:6px;">${esc(a.unidade)}${a.contrato ? ' · contrato ' + esc(a.contrato) : ''}${a.processo ? ' · processo ' + esc(a.processo) : ''}</span></div>
    <h3>${esc(a.titulo)}</h3>
    ${a.descricao ? `<p>${esc(a.descricao)}</p>` : ''}
    ${a.documentos ? `<div class="rot">Documento</div><p>${esc(a.documentos)}</p>` : ''}
    ${a.trecho ? `<div class="rot">Trecho no documento</div><blockquote>${esc(a.trecho)}</blockquote>` : ''}
    ${a.impacto ? `<div class="rot">Impacto</div><p>${esc(a.impacto)}</p>` : ''}
    ${a.risco_controle ? `<div class="rot">Risco perante os órgãos de controle</div><p>${esc(a.risco_controle)}</p>` : ''}
    ${a.sugestao ? `<div class="rot">Sugestão</div><p>${esc(a.sugestao)}</p>` : ''}
    ${comBotoes ? `<div class="rot">Setor responsável</div><select style="max-width:220px" onchange="mudarSetor('${esc(a.id)}', this.value)"><option value="">Sem setor</option>${nomesSetores().map(n => `<option ${a.setor === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : (a.setor ? `<div class="r">Setor responsável</div><p>${esc(a.setor)}</p>` : '')}
    ${comBotoes ? `<div class="acoes"><button class="btn btn-sm btn-claro" onclick="conferir('${esc(a.id)}','sim')"><i class="ti ti-check"></i> Procede</button>
      <button class="btn btn-sm btn-claro" onclick="conferir('${esc(a.id)}','nao')"><i class="ti ti-x"></i> Não procede</button>
      <button class="btn btn-sm btn-claro" onclick="conferir('${esc(a.id)}','')">Limpar</button></div>` : ''}
  </div>`;
}
async function mudarSetor(id, setor) {
  const r = await api('raiox/conferir', { id, setor });
  if (r.ok === false) { alert(r.erro); return; }
  const a = achados.find(x => x.id === id); if (a) a.setor = setor;
  pintarAchados();
}
async function conferir(id, valor) {
  const r = await api('raiox/conferir', { id, conferido: valor });
  if (r.ok === false) { alert(r.erro); return; }
  const a = achados.find(x => x.id === id); if (a) a.conferido = valor;
  pintarAchados();
}

// ==================== TELA: RAIO-X PARA A DIRETORIA ====================
async function telaRx() {
  $('conteudo').innerHTML = carregando('Montando o resumo...');
  const r = await api('raiox/achados', {});
  achados = r.achados || [];
  const ativos = achados.filter(a => a.conferido !== 'nao');
  const cont = (lista, campo) => { const m = {}; lista.forEach(a => { const k = a[campo] || '(sem)'; m[k] = (m[k] || 0) + 1; }); return m; };
  const porGrav = cont(ativos, 'gravidade'), conferidos = ativos.filter(a => a.conferido === 'sim').length;
  $('conteudo').innerHTML = `
    <div class="tiles">
      <div class="tile"><h3>Achados (sem os que não procedem)</h3><div class="grande">${fmt(ativos.length)}</div></div>
      <div class="tile"><h3>Gravidade alta</h3><div class="grande">${fmt(porGrav.alta || 0)}</div></div>
      <div class="tile"><h3>Já conferidos (procedem)</h3><div class="grande">${fmt(conferidos)}<small>de ${fmt(ativos.length)}</small></div></div>
      <div class="tile"><h3>Marcados "não procede"</h3><div class="grande">${fmt(achados.length - ativos.length)}</div></div>
    </div>
    <div class="bloco"><h2><i class="ti ti-file-text"></i> Relatório para a diretoria</h2>
      <div class="dica">Gera um arquivo HTML único, que abre em qualquer computador e imprime como PDF. Os achados que você marcou "não procede" ficam de fora. O que ainda não foi conferido aparece como "a conferir".</div>
      <label class="auto"><input type="checkbox" id="so-conf"> Incluir só os já conferidos (procedem)</label>
      <label class="auto">Organizar os achados do relatório por: <select id="agrupar" style="max-width:200px;display:inline-block"><option value="unidade">Unidade</option><option value="setor">Setor responsável</option></select></label>
      <div class="acoes"><button class="btn btn-principal" onclick="gerarRelatorio()"><i class="ti ti-download"></i> Baixar o relatório (HTML)</button></div>
      <div class="aviso">Uso interno: os documentos de origem podem conter nomes de pessoas. Os achados são sobre documentos e processos, não sobre quem assinou.</div>
    </div>`;
}
function gerarRelatorio() {
  const soConf = $('so-conf').checked;
  let lista = achados.filter(a => a.conferido !== 'nao' && (!soConf || a.conferido === 'sim'));
  lista.sort((x, y) => (ordemGrav[x.gravidade] - ordemGrav[y.gravidade]));
  const porSetorMapa = {}; lista.forEach(a => { const s = a.setor || 'Sem setor'; (porSetorMapa[s] = porSetorMapa[s] || []).push(a); });
  const agruparSetor = ($('agrupar') || {}).value === 'setor';
  const por = {}; lista.forEach(a => { const u = agruparSetor ? (a.setor || 'Sem setor') : (a.unidade || '(sem unidade)'); (por[u] = por[u] || []).push(a); });
  const porUn = {}; lista.forEach(a => { const u = a.unidade || '(sem unidade)'; (porUn[u] = porUn[u] || []).push(a); });
  const unidadesOrd = Object.keys(porUn).sort((a, b) => porUn[b].length - porUn[a].length || a.localeCompare(b, 'pt-BR'));
  const unidades = Object.keys(por).sort((a, b) => por[b].length - por[a].length || a.localeCompare(b, 'pt-BR'));
  const tipos = {}; lista.forEach(a => { tipos[a.tipo] = (tipos[a.tipo] || 0) + 1; });
  const hoje = new Date().toLocaleDateString('pt-BR');
  const css = `body{font-family:Segoe UI,system-ui,sans-serif;color:#1f2a30;margin:0;background:#f4f2ee}main{max-width:980px;margin:0 auto;padding:28px 20px}
    h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.15rem;margin:30px 0 10px;border-bottom:2px solid #b45309;padding-bottom:4px}.sub{color:#66757d;font-size:.9rem}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.tile{background:#fff;border:1px solid #ddd6ca;border-radius:8px;padding:12px 14px}
    .tile b{display:block;font-size:1.8rem}.tile span{font-size:.8rem;color:#66757d}table{border-collapse:collapse;width:100%;background:#fff;font-size:.86rem}
    th,td{padding:7px 9px;border-bottom:1px solid #e7e2d8;text-align:left}th{background:#efebe3}td.n,th.n{text-align:right}
    .a{background:#fff;border:1px solid #ddd6ca;border-left:4px solid #d97706;border-radius:8px;padding:12px 16px;margin:10px 0;page-break-inside:avoid}.a.alta{border-left-color:#8e1628}.a.baixa{border-left-color:#9fb2bb}
    .a h3{font-size:.95rem;margin:4px 0}.r{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#66757d;margin-top:8px}.a p{margin:2px 0;font-size:.86rem;line-height:1.5}
    blockquote{margin:4px 0;background:#f7f5f1;border-left:3px solid #d8cfc0;padding:6px 10px;font-size:.82rem}.s{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:700;margin-right:4px}
    .s.alta{background:#f8d7da;color:#8e1628}.s.media{background:#fff4d6;color:#664d03}.s.baixa{background:#e6ecef;color:#455a64}.e{background:#e6ecef;color:#455a64}.c{background:#d9f1e3;color:#0f5132}.p{background:#fff4d6;color:#664d03}
    .aviso{background:#fff4d6;border-radius:6px;padding:10px 14px;font-size:.84rem;margin:14px 0}@media print{body{background:#fff}.a{border-color:#bbb}}`;
  const tabUn = unidadesOrd.map(u => { const l = porUn[u]; return `<tr><td>${esc(u)}</td><td class="n">${l.length}</td><td class="n">${l.filter(a => a.gravidade === 'alta').length}</td><td class="n">${l.filter(a => a.conferido === 'sim').length}</td></tr>`; }).join('');
  const tabSetor = Object.keys(porSetorMapa).sort((a, b) => porSetorMapa[b].length - porSetorMapa[a].length).map(s => { const l = porSetorMapa[s]; return `<tr><td>${esc(s)}</td><td class="n">${l.length}</td><td class="n">${l.filter(a => a.gravidade === 'alta').length}</td><td class="n">${l.filter(a => a.conferido === 'sim').length}</td></tr>`; }).join('');
  const tabTipo = Object.keys(tipos).sort((a, b) => tipos[b] - tipos[a]).map(t => `<tr><td>${esc(t)}</td><td class="n">${tipos[t]}</td></tr>`).join('');
  const corpo = unidades.map(u => `<h2>${esc(u)} <small style="font-weight:400;color:#66757d">(${por[u].length})</small></h2>` + por[u].map(a => `
    <div class="a ${esc(a.gravidade)}"><span class="s ${esc(a.gravidade)}">${esc(a.gravidade)}</span><span class="s e">${esc(a.tipo)}</span><span class="s ${a.conferido === 'sim' ? 'c' : 'p'}">${a.conferido === 'sim' ? 'conferido: procede' : 'a conferir'}</span>
    <span style="font-size:.78rem;color:#66757d">${a.contrato ? 'contrato ' + esc(a.contrato) : ''}${a.processo ? ' · processo ' + esc(a.processo) : ''}</span>
    <h3>${esc(a.titulo)}</h3>${a.descricao ? `<p>${esc(a.descricao)}</p>` : ''}
    ${a.documentos ? `<div class="r">Documento</div><p>${esc(a.documentos)}</p>` : ''}${a.trecho ? `<div class="r">Trecho no documento</div><blockquote>${esc(a.trecho)}</blockquote>` : ''}
    ${a.impacto ? `<div class="r">Impacto</div><p>${esc(a.impacto)}</p>` : ''}${a.risco_controle ? `<div class="r">Risco perante os órgãos de controle</div><p>${esc(a.risco_controle)}</p>` : ''}
    ${a.sugestao ? `<div class="r">Sugestão</div><p>${esc(a.sugestao)}</p>` : ''}</div>`).join('')).join('');
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raio-X documental — DGMCG/GGPCG</title><style>${css}</style></head><body><main>
    <h1>Raio-X documental</h1><div class="sub">Inconsistências presentes nos documentos da base, em ${hoje}. DGMCG/GGPCG — SES-PE.</div>
    <div class="aviso">Uso interno. Os achados apontam inconsistências nos documentos e processos, não em pessoas. Itens "a conferir" foram identificados por código ou por IA e ainda não foram checados por uma pessoa.
    Não se afirma que a inconsistência tenha causado dano ou tenha passado sem correção posterior: o relatório mostra o que consta nos documentos.</div>
    <div class="tiles"><div class="tile"><b>${lista.length}</b><span>achados</span></div><div class="tile"><b>${lista.filter(a => a.gravidade === 'alta').length}</b><span>de gravidade alta</span></div>
      <div class="tile"><b>${lista.filter(a => a.conferido === 'sim').length}</b><span>já conferidos (procedem)</span></div><div class="tile"><b>${unidadesOrd.length}</b><span>unidades com achados</span></div></div>
    <h2>Por setor responsável</h2><table><thead><tr><th>Setor</th><th class="n">Achados</th><th class="n">Alta</th><th class="n">Conferidos</th></tr></thead><tbody>${tabSetor}</tbody></table>
    <h2>Por unidade</h2><table><thead><tr><th>Unidade</th><th class="n">Achados</th><th class="n">Alta</th><th class="n">Conferidos</th></tr></thead><tbody>${tabUn}</tbody></table>
    <h2>Por tipo</h2><table><thead><tr><th>Tipo</th><th class="n">Achados</th></tr></thead><tbody>${tabTipo}</tbody></table>
    ${corpo}<p class="sub" style="margin-top:30px">Gerado pelo Raio-X em ${hoje}. © 2026 SES-PE — DGMCG/GGPCG.</p></main></body></html>`;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Raio-X_documental_' + new Date().toISOString().slice(0, 10) + '.html'; document.body.appendChild(a); a.click(); a.remove();
}

// ==================== AVISO DE VERSÃO NOVA ====================
let _ultimaChecagemVersao = 0;
async function verificarVersaoNova(forcar) {
  if (!forcar && Date.now() - _ultimaChecagemVersao < 5 * 60 * 1000) return;
  _ultimaChecagemVersao = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const t = await r.text(), v = t.match(/const VERSAO_RAIOX\s*=\s*'([^']+)'/), d = t.match(/const VERSAO_RAIOX_DATA\s*=\s*'([^']+)'/);
    if (v && (v[1] !== VERSAO_RAIOX || (d && d[1] !== VERSAO_RAIOX_DATA)) && !document.getElementById('faixa-versao')) {
      const f = document.createElement('div'); f.id = 'faixa-versao';
      f.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:2000;background:#212529;color:#f3f7f9;padding:10px 14px;border-radius:8px;font-size:.85rem;display:flex;gap:10px;align-items:center';
      f.innerHTML = `<span>Há uma versão nova. Salve o que estiver fazendo e atualize.</span><button class="btn btn-sm btn-principal" onclick="location.reload()">Atualizar</button>`;
      document.body.appendChild(f);
    }
  } catch (e) { /* sem rede */ }
}
window.name = 'sei_raiox';
window.addEventListener('load', () => { setTimeout(() => verificarVersaoNova(true), 4000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarVersaoNova(); }); });
window.addEventListener('beforeunload', e => { if (rodando) { e.preventDefault(); e.returnValue = ''; } });
</script>
