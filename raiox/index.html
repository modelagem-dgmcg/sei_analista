  .val { display:inline-block; background:#eef4f6; border-radius:6px; padding:2px 8px; font-size:.76rem; margin:2px 4px 0 0; }
  .janela-fundo { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .janela { background:#fff; border-radius:10px; padding:22px; width:100%; max-width:760px; max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .janela h2 { font-size:1.05rem; margin-bottom:6px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:gira .75s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:14px; margin-bottom:16px; }

  .evolucao svg { width:100%; height:150px; display:block; } .evolucao text { font-size:10px; fill:#66757d; }
  .auto { display:flex; gap:8px; align-items:center; font-size:.84rem; margin-top:12px; font-weight:600; color:var(--texto); cursor:pointer; } .auto input { width:auto; margin:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  .item.salvo { padding:10px 14px; }

  @media (max-width:640px) { header, nav.abas, main { padding-left:14px; padding-right:14px; } .campos .largo { grid-column:span 1; } }

  :root { --noite:#212529; --noite2:#343a40; --acento:#b45309; --acento-claro:#fdf0e0; }
  header h1 span { color:#f5a524; }

  .sev { display:inline-block; padding:2px 9px; border-radius:10px; font-size:.72rem; font-weight:700; }
  .sev.alta { background:var(--bordo-claro); color:var(--bordo); } .sev.media { background:#fff4d6; color:#664d03; } .sev.baixa { background:#e6ecef; color:#455a64; }
  .card-ach { background:#fff; border:1px solid var(--borda); border-left:4px solid var(--ambar); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  .card-ach.alta { border-left-color:var(--bordo); } .card-ach.baixa { border-left-color:#9fb2bb; }
  .card-ach h3 { font-size:.92rem; margin:6px 0 4px; }

  .card-ach p { font-size:.84rem; line-height:1.5; margin-top:2px; white-space:pre-wrap; }
  .card-ach blockquote { font-size:.8rem; background:#f7f5f1; border-left:3px solid #d8cfc0; padding:6px 10px; margin-top:4px; color:#4a4237; }

</style>

<body>
<div id="login">
  <div class="login-box">
    <h1 class="marca"><span>Raio-X</span></h1>
    <div class="sub">Escrutínio geral da base de documentos — acesso restrito</div>
    <label for="l-usuario">Login institucional</label><input id="l-usuario" placeholder="nome.sobrenome">
    <label for="l-senha">Senha</label><input id="l-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') entrar()">
    <button class="btn btn-principal" style="width:100%; justify-content:center; margin-top:18px; padding:11px;" onclick="entrar()"><i class="ti ti-login-2"></i> Entrar</button>
    <div id="l-erro" class="erro hidden"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1><span>Raio-X</span></h1>
    <div class="dir"><span id="quem"></span><button class="btn btn-sm" onclick="sair()"><i class="ti ti-logout"></i> Sair</button></div>
  </header>
  <nav class="abas" id="nav"></nav>
  <main id="conteudo"></main>
  <footer>© 2026 SES-PE — DGMCG/GGPCG. Desenvolvido por <strong>Cleuton Vieira</strong>.<br><span id="rodape-versao"></span></footer>
</div>

<script>
// ============================================================
// RAIO-X — lógica da página
// ============================================================
const VERSAO_RAIOX = 'v0.16';
const VERSAO_RAIOX_DATA = '26/10/2026 16:10';
const API_URL = 'https://script.google.com/macros/s/AKfycbzzcJEAQPUCwY5YC2o1O5bj500pRE2mOFfZrLCy-e2kFzIgoDkebamJBgQK_yV2Ez0b/exec';
const JANELAS_MAX = 8;           // por escopo (cada janela ~110 mil caracteres)
const CHUNK_IA = 30000;          // caracteres por chamada à IA

let TOKEN = null, usuario = null, abaAtual = 'rodar', PAPEL = '';
let escopos = [], achados = [], chaves = [], parar = false, rodando = false;

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const dorme = ms => new Promise(r => setTimeout(r, ms));
async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function api(acao, corpo, tempoMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), tempoMs || 120000);
  try {
    const r = await fetch(API_URL + '?action=' + encodeURIComponent(acao), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, signal: ctrl.signal,
      body: JSON.stringify(Object.assign({}, corpo || {}, { token: TOKEN }))
    });
    let res;
    try { res = JSON.parse(await r.text()); } catch (e) { return { ok: false, erro: 'O servidor respondeu de um jeito inesperado. Tente de novo em instantes.' }; }
    if (res && res.sessao_expirada && acao !== 'auth/login') sessaoVencida();
    return res || { ok: false, erro: 'Resposta vazia do servidor.' };
  } catch (e) {
    return { ok: false, erro: e.name === 'AbortError' ? 'O servidor demorou demais para responder.' : 'Sem conexão com o servidor: ' + e.message };
  } finally { clearTimeout(timer); }
}
function sessaoVencida() {
  TOKEN = null; parar = true;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  const e = $('l-erro'); e.textContent = 'Sua sessão venceu. Entre de novo.'; e.classList.remove('hidden');
  if (usuario) $('l-usuario').value = usuario.email;
}
async function entrar() {
  const erro = $('l-erro'); erro.classList.add('hidden');
  const email = $('l-usuario').value.trim(), senha = $('l-senha').value;
  if (!email || !senha) { erro.textContent = 'Preencha login e senha.'; erro.classList.remove('hidden'); return; }
  const res = await api('auth/login', { email, senha_hash: await sha256(senha), app: 'raiox' });
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível entrar.'; erro.classList.remove('hidden'); return; }
  TOKEN = res.token; usuario = res.usuario;
  $('l-senha').value = ''; $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('quem').textContent = usuario.nome;
  $('rodape-versao').textContent = `Raio-X ${VERSAO_RAIOX} · ${VERSAO_RAIOX_DATA} — Servidor ${res.versao_backend || 'sem versão'}`;
  const eu = await api('raiox/eu', {});
  PAPEL = (eu && eu.ok && eu.papel) || '';
  if (!PAPEL) { $('nav').innerHTML = ''; $('conteudo').innerHTML = `<div class="erro">${esc((eu && eu.erro) || 'Você ainda não tem um papel no Raio-X. Peça ao administrador que cadastre você na aba Equipe.')}</div>`; return; }
  if (PAPEL === 'admin') { const r = await api('ia/minhas-chaves', {}); chaves = (r && r.ok && r.chaves) || []; }
  montarNav();
  abrirAba(PAPEL === 'analista' ? 'minhas' : PAPEL === 'coordenacao' ? 'fatias' : 'rodar');
}
async function sair() { try { await api('auth/logout', {}); } catch (e) {} TOKEN = null; location.reload(); }

// ==================== ABAS ====================
const ABAS_POR_PAPEL = {
  admin: [['rodar', 'Rodar'], ['achados', 'Achados'], ['rx', 'Raio-X para a diretoria'], ['fatias', 'Fatias e pareceres'], ['equipe', 'Equipe']],
  coordenacao: [['achados', 'Achados'], ['fatias', 'Fatias e pareceres']],
  analista: [['minhas', 'Minhas fatias']]
};
function montarNav() {
  $('nav').innerHTML = (ABAS_POR_PAPEL[PAPEL] || []).map(x => `<a href="#" id="aba-${x[0]}" onclick="abrirAba('${x[0]}'); return false;">${esc(x[1])}</a>`).join('');
}
function abrirAba(a) {
  if (!(ABAS_POR_PAPEL[PAPEL] || []).some(x => x[0] === a)) return;
  abaAtual = a;
  (ABAS_POR_PAPEL[PAPEL] || []).forEach(x => { const el = $('aba-' + x[0]); if (el) el.classList.toggle('ativa', x[0] === a); });
  if (a === 'rodar') telaRodar(); else if (a === 'achados') telaAchados(); else if (a === 'rx') telaRx();
  else if (a === 'fatias' || a === 'minhas') telaFatias(); else if (a === 'equipe') telaEquipe();
}
const carregando = t => `<div class="vazio"><span class="spinner"></span>${esc(t || 'Carregando...')}</div>`;

// ==================== IA (chamada pelo navegador, com as chaves da Gestão) ====================
const DADOS_PROV = {
  gemini: { url: k => `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${k}`, modelo: 'gemini-3.6-flash' },
  groq: { url: () => 'https://api.groq.com/openai/v1/chat/completions', modelo: 'llama-3.3-70b-versatile' },
  kimi: { url: () => 'https://api.moonshot.ai/v1/chat/completions', modelo: 'kimi-k2.6', espera: 240000 },
  openrouter: { url: () => 'https://openrouter.ai/api/v1/chat/completions', modelo: 'openrouter/free' },

async function chamarProvedor(servico, chave, prompt) {
  const d = DADOS_PROV[servico]; if (!d) throw new Error('serviço desconhecido');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), d.espera || 120000);
  try {
    let resp, txt;
    if (servico === 'gemini') {
      resp = await fetch(d.url(chave), { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json' } }) });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
      const j = await resp.json(); txt = j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('');
    } else {
      const body = { model: d.modelo, messages: [{ role: 'user', content: prompt }], response_format: { type: 'json_object' } };
      if (servico !== 'kimi') body.temperature = 0.1;
      resp = await fetch(d.url(), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + chave }, signal: ctrl.signal, body: JSON.stringify(body) });
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()).slice(0, 200));
      const j = await resp.json(); txt = j.choices?.[0]?.message?.content;
    }
    if (!txt) throw new Error('sem conteúdo');
    return txt.replace(/```json/g, '').replace(/```/g, '').trim();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'sem resposta no prazo' : e.message); }
  finally { clearTimeout(timer); }
}
let _provedorAtual = '';
async function perguntarIA(prompt, log) {
  if (!chaves.length) throw new Error('Nenhuma chave de IA liberada para o seu usuário. Peça na Gestão.');
  const erros = [];
  for (const c of chaves) {
    if (!DADOS_PROV[c.servico]) continue;
    try { const t = await chamarProvedor(c.servico, c.chave, prompt); _provedorAtual = DADOS_PROV[c.servico].modelo; return t; }
    catch (e) { erros.push(c.nome + ': ' + e.message); log('  ' + c.nome + ' falhou: ' + e.message.slice(0, 120)); }

}

function docsMascarar_(texto, nomesExtra) {
  let txt = String(texto || ''), n = 0;
  const por = {};
  const conta = marca => { n++; por[marca] = (por[marca] || 0) + 1; };
  const troca = (re, marca) => { txt = txt.replace(re, () => { conta(marca); return marca; }); };
  const trocaComRotulo = (re, marca) => { txt = txt.replace(re, (m, rotulo) => { conta(marca); return rotulo + marca; }); };

  // 1) bloco de qualificação do representante: da âncora até o fim da frase (no máximo 220 caracteres)
  const ANC = /(neste\s+ato\s+representad[oa]\s+por|representad[oa]\s+neste\s+ato\s+por|por\s+seu[a]?\s+representante\s+legal[,:]?)/gi;
  let saida = '', pos = 0, m;
  while ((m = ANC.exec(txt))) {
    const ini = m.index + m[0].length, resto = txt.substr(ini, 220), k = resto.search(/[.;]\s/), tam = k >= 0 ? k : resto.length;
    if (tam < 3) { ANC.lastIndex = ini; continue; }
    saida += txt.slice(pos, ini) + ' [REPRESENTANTE]'; pos = ini + tam; ANC.lastIndex = pos; conta('[REPRESENTANTE]');
  }
  txt = saida + txt.slice(pos);

  // 2) documentos e contatos
  troca(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g, '[CPF]');
  trocaComRotulo(/(\bCPF\b[^\d\n]{0,12})\d{11}\b/gi, '[CPF]');
  troca(/\b\d{1,2}\.\d{3}\.\d{3}-[\dxX]\b/g, '[RG]');
  trocaComRotulo(/((?:\bRG\b|\bidentidade\b)[^\d\n]{0,15})[\d][\d.\-xX]{4,13}/gi, '[RG]');
  troca(/[\w.+-]+@[\w-]+\.[\w.-]+/g, '[E-MAIL]');
  troca(/\+55\s?\(?\d{2}\)?\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  troca(/\(\d{2}\)\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  trocaComRotulo(/((?:\btel(?:efone)?\b\.?|\bcel(?:ular)?\b\.?|\bfone\b)[^\d\n]{0,8})\d{2}\s?9?\d{4}-?\d{4}\b/gi, '[TELEFONE]');
  troca(/\b(?:ag[êe]ncia|conta\s+corrente|conta\s+poupan[çc]a|conta\s+banc[áa]ria|c\/c)\s*(?:n[º°o.]*)?\s*:?\s*\d{3,10}(?:-\d)?\b/gi, '[DADO BANCÁRIO]');
  troca(/\bmatr[íi]cula\s*(?:n[º°o.]*)?\s*:?\s*\d[\d.\-]{3,11}\b/gi, '[MATRÍCULA]');

  // 3) nomes que a pessoa pediu para mascarar neste documento
  (nomesExtra || []).forEach(nome => {
    const t = String(nome || '').trim();
    if (t.length < 3) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'), 'gi');
    troca(re, '[NOME]');
  });
  return { texto: txt, trocas: n, por_tipo: por };
}

function logar(t) { const l = $('log'); if (!l) return; l.classList.remove('hidden'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; }
function prog(t) { const p = $('progresso'); if (p) p.innerHTML = t; }

async function rodarCodigo() {

  const r = await api('raiox/codigo', {}, 300000);
  rodando = false;
  prog(r.ok === false ? `<span style="color:var(--bordo)">${esc(r.erro)}</span>` : `Pronto: ${fmt(r.achados_codigo)} achados por código em ${fmt(r.documentos)} documentos.`);
  $('btn-codigo').disabled = false;
}
async function rodarPendentes(tipo) {
  const fila = escopos.filter(e => e.tipo === tipo && e.estado === 'pendente');
  if (!fila.length) { prog('Não há ' + (tipo === 'contrato' ? 'contratos' : 'processos') + ' pendentes.'); return; }
  parar = false; rodando = true; desenharRodar(escopos.reduce((s, e) => s + e.n_docs, 0));
  let i = 0;
  for (const e of fila) {
    if (parar) break; i++;
    prog(`<span class="spinner"></span>${i} de ${fila.length}: ${esc(e.rotulo)}`);
    await rodarEscopo(e);
  }
  rodando = false; parar = false; await telaRodar();
}
async function rodarUm(id) {
  const e = escopos.find(x => x.escopo === id); if (!e) return;
  parar = false; rodando = true; desenharRodar(escopos.reduce((s, x) => s + x.n_docs, 0));
  prog(`<span class="spinner"></span>${esc(e.rotulo)}`);
  await rodarEscopo(e);
  rodando = false; await telaRodar();
}
async function rodarEscopo(e) {
  logar('▶ ' + e.rotulo);
  const todos = []; let inicio = 0, janelas = 0, total = 0, lido = 0, parcial = false, modelo = '';
  while (inicio !== null && janelas < JANELAS_MAX) {
    if (parar) { parcial = true; break; }
    const pk = await api('raiox/pacote', { escopo: e.escopo, inicio });
    if (pk.ok === false) { logar('  erro: ' + pk.erro); parcial = true; break; }
    total = pk.total_chars; lido = pk.fim; janelas++;
    const masc = docsMascarar_(pk.texto, []).texto;
    for (let i = 0; i < masc.length; i += CHUNK_IA) {
      if (parar) { parcial = true; break; }
      const parte = masc.slice(i, i + CHUNK_IA);
      try {
        const bruto = await perguntarIA(montarPrompt(e.rotulo, parte), logar);
        modelo = _provedorAtual;
        let j; try { j = JSON.parse(bruto); } catch (x) { logar('  resposta fora do formato; trecho ignorado'); continue; }
        (Array.isArray(j) ? j : (j.achados || [])).forEach(a => {
          if (!a || !a.titulo) return;
          const confere = a.trecho && normT(parte).includes(normT(a.trecho)) ? 'sim' : (a.trecho ? 'nao' : '');
          todos.push(Object.assign({}, a, { trecho_confere: confere, setor: setorValido(a.setor) }));
        });
      } catch (x) { logar('  ' + x.message.slice(0, 200)); parcial = true; break; }
    }
    if (parcial) break;
    inicio = pk.proximo;
  }
  if (inicio !== null && !parcial) parcial = true;       // sobrou texto além do limite de janelas
  const vistos = {}, unicos = todos.filter(a => { const k = normT(a.titulo); if (vistos[k]) return false; vistos[k] = 1; return true; });
  const s = await api('raiox/salvar', { escopo: e.escopo, achados: unicos, parcial, lido_chars: lido, total_chars: total, modelo });
  logar(s.ok === false ? '  não salvou: ' + s.erro : `  ${unicos.length} achados guardados${parcial ? ' (leitura parcial: ' + fmt(lido) + ' de ' + fmt(total) + ' caracteres)' : ''}`);
  const x = escopos.find(z => z.escopo === e.escopo); if (x && s.ok !== false) { x.estado = parcial ? 'parcial' : 'concluido'; x.n_achados = unicos.length; }
}

// ---- exportar achados em CSV (UTF-8 com BOM, separador ponto e vírgula, abre direto no Excel em português) ----
const CSV_COLS = ['id', 'unidade', 'contrato', 'processo', 'sei_contrato', 'sei_instrumento', 'instrumento_citado', 'instrumentos', 'gravidade', 'tipo', 'regra', 'origem', 'titulo', 'descricao', 'documentos', 'trecho', 'trecho_confere', 'impacto', 'risco_controle', 'sugestao', 'setor', 'orgaos', 'liga_passado', 'ligacao', 'papel', 'oculto_passado', 'conferido', 'obs', 'escopo', 'criado_por', 'criado_em', 'tce_processos', 'tce_temas', 'tce_relacao', 'tce_persistencia'];
function csvCel(v) { let s = String(v === null || v === undefined ? '' : v).replace(/\r?\n/g, ' ').trim(); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
function baixarCsvAchados(soFiltrados) {
  const lista = soFiltrados ? filtrados() : achados;
  if (!lista.length) { alert('Nenhum achado para baixar.'); return; }
  const extras = [...new Set(lista.flatMap(a => Object.keys(a)))].filter(k => !CSV_COLS.includes(k) && !k.startsWith('_'));
  const cols = CSV_COLS.concat(extras);
  const linhas = [cols.map(csvCel).join(';')].concat(lista.map(a => cols.map(c => csvCel(a[c])).join(';')));
  const blob = new Blob(['\ufeff' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const nome = `raiox_achados_${soFiltrados ? 'filtrados' : 'todos'}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.csv`;
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const ordemGrav = { alta: 0, media: 1, baixa: 2 };
function filtrados() {
  const v = id => ($(id) || {}).value || '';
  const q = normT(v('f-q'));
  const verOcultos = !!($('f-ocultos') && $('f-ocultos').checked);
  return achados.filter(a => (verOcultos || !a.oculto_passado) && (!v('f-unidade') || a.unidade === v('f-unidade')) && (!v('f-grav') || a.gravidade === v('f-grav')) && (!v('f-orig') || a.origem === v('f-orig')) &&
    (!v('f-setor') || (v('f-setor') === '__sem' ? !a.setor : a.setor === v('f-setor'))) && (!v('f-orgao') || lerOrgaos(a).includes(v('f-orgao'))) && (!v('f-tipo') || a.tipo === v('f-tipo')) && (!v('f-conf') || (v('f-conf') === 'pend' ? !a.conferido : a.conferido === v('f-conf'))) &&
    (!v('f-tce') || (v('f-tce') === 'sem' ? !a.tce_ref : v('f-tce') === 'aud' ? a.tce_relacao === 'mesmo tema em contrato auditado' : v('f-tce') === 'pers' ? !!a.tce_persist : v('f-tce') === 'risco' ? a.tce_relacao === 'mesmo tipo de risco em outro contrato' : (a.tce_processos || '').includes(v('f-tce')))) &&
    (!q || normT([a.titulo, a.descricao, a.unidade, a.contrato, a.documentos].join(' ')).includes(q)))
    .sort((x, y) => (ordemGrav[x.gravidade] - ordemGrav[y.gravidade]) || String(x.unidade).localeCompare(String(y.unidade), 'pt-BR'));
}
function pintarAchados() {

const visivel = a => a.conferido !== 'nao' && !a.oculto_passado;

// Achados antigos não têm o campo de órgãos: deduz pelo texto do risco e do impacto (aproximado) e marca como deduzido.
// ---- referência aos processos do TCE-PE (indício por tema, calculado no navegador; não grava nada) ----
const TCE_PROC = { '25100813-7': 'Proc. TCE-PE 25100813-7 (UPA Olinda 001/2022 e UPAE Carpina 022/2022)', '24100082-8': 'Proc. TCE-PE 24100082-8 (Hospital Pelópidas Silveira 017/2022)' };

const TCE_TEMA_PROC = { T1: ['25100813-7'], T2: ['25100813-7'], T3: ['25100813-7'], T4: ['25100813-7'], T5: ['25100813-7', '24100082-8'] };
const TCE_DELIB = { '24100082-8': { data: '23/09/2025', ano: 2025 }, '25100813-7': { data: '02/07/2026', ano: 2026 } };
const TCE_CONTRATO_AUDITADO = { '001/2022': '25100813-7', '022/2022': '25100813-7', '017/2022': '24100082-8' };
const TCE_RE = {
  D1: /\bdescont[oa]s?\b|glosa|15-a|encontro de contas|abatiment|ressarcimento|producao excedente|compensa/, V1: /parcela variavel|parte variavel|remuneracao variavel|repasse variavel/,
  R2: /repactua|renegocia|redimension/, T3: /transparenc|\bportal\b|\bcsv\b|extratos? bancari|dados abertos|154\/2021|publicacao de informac/,
  C5: /\bctai\b|\bcma\b|comissao (tecnica|mista)|acompanhamento interno|\bparecer\b|\bpareceres\b/
};
function temasTce(a) {
  const t = normT(a.titulo), d = normT(a.descricao), R = TCE_RE, out = {};
  if (R.D1.test(t)) out.T1 = 'direto'; else if (R.D1.test(d) || R.V1.test(t + ' ' + d)) out.T1 = 'indireto';
  if (R.R2.test(t) || (/prorrog/.test(t) && /\bmetas?\b/.test(t))) out.T2 = 'direto'; else if (R.R2.test(d)) out.T2 = 'indireto';
  if (R.T3.test(t)) out.T3 = 'direto'; else if (/transparenc/.test(d) && /indicador/.test(d)) out.T3 = 'indireto';
  if (a.liga_passado === 'sim') out.T4 = 'direto';
  if (R.C5.test(t)) out.T5 = 'direto'; else if (R.C5.test(d)) out.T5 = 'indireto';

}
// ano do SEI do instrumento (o número do SEI traz o ano em que o processo foi aberto; não é a data do aditivo)
function anoSeiInstrumento(a) {
  let sei = String(a.sei_instrumento || '');
  if (!sei) {
    const m = (String(a.titulo || '') + ' ' + String(a.documentos || '')).toLowerCase().match(/(\d+)\s*[º°o]\s*(?:termo aditivo|ta\b)/);
    if (m) { const r = new RegExp('Aditivo ' + m[1] + '\\s*[º°o]?\\s*:\\s*([0-9./-]+)', 'i').exec(String(a.instrumentos || '')); if (r) sei = r[1]; }
  }
  const y = sei.match(/\/(\d{4})-\d\d/); return y ? +y[1] : 0;
}

    const m = temasTce(a), ks = Object.keys(m), procs = [...new Set(ks.flatMap(k => TCE_TEMA_PROC[k]))];
    const ca = TCE_CONTRATO_AUDITADO[String(a.contrato || '').trim()];
    a.tce_temas = ks.map(k => k + ' (' + m[k] + ')').join('; ');
    a.tce_processos = procs.join('; ');
    a.tce_relacao = !ks.length ? '' : (ca && procs.includes(ca) ? 'mesmo tema em contrato auditado' : 'mesmo tipo de risco em outro contrato');
    a.tce_persist = ''; a.tce_persist_txt = '';
    const ano = ks.length ? anoSeiInstrumento(a) : 0;
    if (ano) {
      const pos = procs.filter(x => ano > TCE_DELIB[x].ano), igual = procs.filter(x => ano === TCE_DELIB[x].ano);
      if (pos.length) { a.tce_persist = 'posterior'; a.tce_persist_txt = 'Instrumento com processo SEI de ' + ano + ', posterior à deliberação do TCE-PE (proc. ' + pos[0] + ', sessão de ' + TCE_DELIB[pos[0]].data + '). Indício de que o tema continua depois do apontamento; confirmar a data do instrumento.'; }
      else if (igual.length) { a.tce_persist = 'conferir'; a.tce_persist_txt = 'Instrumento com processo SEI de ' + ano + ', mesmo ano da deliberação do TCE-PE (proc. ' + igual[0] + ', sessão de ' + TCE_DELIB[igual[0]].data + '). Conferir se o instrumento é posterior à deliberação.'; }
    }

    a.tce_ref = ks.length ? ks.map(k => TCE_TEMA_PROC[k].map(x => 'Proc. ' + x).join(' e ') + ' · ' + TCE_TEMAS[k] + ' (' + m[k] + ')').join(' | ') : '';
  });

}
function prepararAchados(lista) {

    ['TJPE', /\btjpe\b|poder judici[aá]rio|a[cç][aã]o judicial/i], ['CGE-PE', /\bcge\b|\bscge\b|controladoria/i], ['ALEPE', /\balepe\b|assembleia legislativa/i],
    ['Conselho Estadual de Saúde', /conselho (estadual )?de sa[uú]de/i], ['Federal (TCU/CGU/DENASUS)', /\btcu\b|\bcgu\b|denasus|tribunal de contas da uni[aã]o/i]];

(function () { const st = document.createElement('style'); st.textContent = CSS_RX + `

const ROTULO_PAPEL = { ativo: 'dentro do prazo', estendido: 'estendido (prazo vencido)', anterior: 'contrato anterior', '': '' };
const COLUNAS = {
  gravidade: ['Gravidade', a => a.gravidade, a => `<span class="rx-g ${esc(a.gravidade)}">${esc(a.gravidade)}</span>`],
  unidade: ['Unidade', a => a.unidade],
  contrato: ['Contrato / processo', a => a.contrato || a.processo || ''],
  sei: ['Processo SEI', a => [a.sei_contrato, a.sei_instrumento ? (a.instrumento_citado + ': ' + a.sei_instrumento) : ''].filter(Boolean).join(' · ')],
  titulo: ['Achado', a => a.titulo],
  tce: ['Alerta TCE-PE', a => a.tce_ref ? 'Tema já tratado pelo TCE-PE: ' + a.tce_ref + (a.tce_persist ? ' | ' + a.tce_persist_txt : '') : '', a => a.tce_ref ? `<span style="color:#8e1628;font-weight:600">Tema já tratado pelo TCE-PE</span><br>${esc(a.tce_ref)}${a.tce_persist ? `<br><b>${a.tce_persist === 'posterior' ? 'Mesmo depois do apontamento, o tema aparece de novo.' : 'Possível persistência: conferir data.'}</b>` : ''}` : ''],
  tipo: ['Tipo', a => a.tipo],
  setor: ['Setor', a => a.setor || 'Sem setor'],
  orgaos: ['Órgãos', a => a.orgaos || ''],
  conferido: ['Conferência', a => a.conferido === 'sim' ? 'procede' : 'a conferir'],
  ligacao: ['Ligação com o passado', a => a.liga_passado === 'sim' ? a.ligacao : ''],
  documentos: ['Documento', a => a.documentos],
  impacto: ['Impacto', a => a.impacto],
  sugestao: ['Sugestão', a => a.setor === 'CCGP' ? '' : a.sugestao]
};
const COLUNAS_PADRAO = ['gravidade', 'unidade', 'contrato', 'sei', 'titulo', 'tipo', 'setor', 'orgaos', 'tce', 'documentos', 'impacto', 'sugestao'];

function htmlMatriz(lista, clicavel) {
  if (!lista.length) return '<div class="vazio">Sem achados neste filtro.</div>';
  const setores = [...new Set(lista.map(a => a.setor || 'Sem setor'))].sort((x, y) => lista.filter(a => (a.setor || 'Sem setor') === y).length - lista.filter(a => (a.setor || 'Sem setor') === x).length);
  const orgs = ORGAOS.filter(o => lista.some(a => lerOrgaos(a).includes(o)));
  if (lista.some(a => !lerOrgaos(a).length)) orgs.push(SEM_ORGAO);
  const noCel = (a, s, o) => (a.setor || 'Sem setor') === s && (o === SEM_ORGAO ? !lerOrgaos(a).length : lerOrgaos(a).includes(o));
  let max = 1; setores.forEach(s => orgs.forEach(o => { max = Math.max(max, lista.filter(a => noCel(a, s, o)).length); }));
  const linhas = setores.map(s => `<tr><td class="rot">${esc(s)}</td>${orgs.map(o => {
    const n = lista.filter(a => noCel(a, s, o)).length, al = n ? 0.1 + 0.75 * n / max : 0;
    return `<td class="c ${clicavel && n ? 'rx-clic' : ''}" style="${n ? 'background:rgba(142,22,40,' + al.toFixed(2) + ');color:' + (al > 0.5 ? '#fff' : '#1f2a30') + ';-webkit-print-color-adjust:exact;print-color-adjust:exact;' : 'color:#b8b2a6'}" ${clicavel && n ? `onclick="irAchados(${esc(JSON.stringify({ setor: s, orgao: o === SEM_ORGAO ? '' : o }))})"` : ''}>${n || '·'}</td>`;
  }).join('')}<td class="t">${lista.filter(a => (a.setor || 'Sem setor') === s).length}</td></tr>`).join('');
  const total = `<tr><td class="rot t">Total</td>${orgs.map(o => `<td class="t">${lista.filter(a => o === SEM_ORGAO ? !lerOrgaos(a).length : lerOrgaos(a).includes(o)).length}</td>`).join('')}<td class="t">${lista.length}</td></tr>`;
  return `<table class="rx-mat"><thead><tr><th class="rot">Setor responsável</th>${orgs.map(o => `<th>${esc(o)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${linhas}${total}</tbody></table>
    <div class="rx-nota">Só aparecem os órgãos citados nos achados. Um achado pode interessar a mais de um órgão e contar em mais de uma coluna; o total da linha conta cada achado uma vez.${lista.some(a => a.orgaos_deduzidos) ? ' Nos achados lidos antes desta versão, os órgãos foram deduzidos do texto do risco (aproximado).' : ''}</div>`;
}

function htmlBarras(lista, clicavel) {
  if (!lista.length) return '<div class="vazio">Sem achados neste filtro.</div>';
  const por = {}; lista.forEach(a => { const u = a.unidade || '(sem unidade)', o = por[u] = por[u] || { alta: 0, media: 0, baixa: 0, n: 0 }; o[a.gravidade] = (o[a.gravidade] || 0) + 1; o.n++; });
  const us = Object.keys(por).sort((x, y) => por[y].alta - por[x].alta || por[y].n - por[x].n || x.localeCompare(y, 'pt-BR')).slice(0, 20), max = Math.max(...us.map(u => por[u].n));
  return `<div class="rx-leg"><b style="background:#8e1628"></b>alta<b style="background:#d97706"></b>média<b style="background:#9fb2bb"></b>baixa${Object.keys(por).length > 20 ? ' · mostrando as 20 unidades com mais achados graves' : ''}</div>` +
    us.map(u => { const o = por[u], w = k => (100 * (o[k] || 0) / max).toFixed(1);
      return `<div class="rx-bar ${clicavel ? 'rx-clic' : ''}" ${clicavel ? `onclick="irAchados(${esc(JSON.stringify({ unidade: u }))})"` : ''}><span>${esc(u)}</span><span class="rx-trilho"><i class="alta" style="width:${w('alta')}%"></i><i class="media" style="width:${w('media')}%"></i><i class="baixa" style="width:${w('baixa')}%"></i></span><b>${o.n}</b></div>`; }).join('');
}

function htmlTabContratos(lista) {
  if (!lista.length) return '<div class="vazio">Sem achados neste filtro.</div>';
  const por = {}; lista.forEach(a => { const k = (a.unidade || '') + '|' + (a.contrato || a.processo || '—'); const o = por[k] = por[k] || { unidade: a.unidade || '(sem unidade)', cod: a.contrato || (a.processo ? 'processo ' + a.processo : '—'), papel: a.papel || '', sei: a.sei_contrato || '', n: 0, alta: 0, conf: 0 }; o.n++; if (a.gravidade === 'alta') o.alta++; if (a.conferido === 'sim') o.conf++; });
  const ks = Object.keys(por).sort((x, y) => por[y].alta - por[x].alta || por[y].n - por[x].n);
  return `<table class="rx-tab"><thead><tr><th>Unidade</th><th>Contrato / processo</th><th>Situação</th><th>Processo SEI</th><th class="n">Achados</th><th class="n">Alta</th><th class="n">Conferidos</th></tr></thead><tbody>${ks.map(k => { const o = por[k]; return `<tr><td>${esc(o.unidade)}</td><td>${esc(o.cod)}</td><td>${esc(ROTULO_PAPEL[o.papel] || '')}</td><td>${esc(o.sei)}</td><td class="n">${o.n}</td><td class="n">${o.alta}</td><td class="n">${o.conf}</td></tr>`; }).join('')}</tbody></table>`;
}

function htmlTabelaAchados(lista, cols) {
  if (!cols.length) return '<div class="vazio">Escolha ao menos uma coluna.</div>';
  const cab = cols.map(c => `<th>${esc(COLUNAS[c][0])}</th>`).join('');
  const ord = lista.slice().sort((x, y) => (ordemGrav[x.gravidade] - ordemGrav[y.gravidade]) || String(x.unidade).localeCompare(String(y.unidade), 'pt-BR'));
  return `<table class="rx-tab"><thead><tr>${cab}</tr></thead><tbody>${ord.map(a => `<tr>${cols.map(c => `<td>${COLUNAS[c][2] ? COLUNAS[c][2](a) : esc(COLUNAS[c][1](a))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

// Tabela de achados com filtros (funciona dentro do relatório, no link e no arquivo baixado)
const SCRIPT_FILTRO_REL = '(function(){var t=document.getElementById("tab-ach");if(!t)return;var rows=[].slice.call(t.tBodies[0].rows);var ids=["f-g","f-u","f-s","f-o","f-t"];' +
  'function v(i){var e=document.getElementById(i);return e?e.value:"";}' +
  'function aplicar(){var q=v("f-q").toLowerCase(),n=0;rows.forEach(function(r){var d=r.dataset;var ok=(!v("f-g")||d.g===v("f-g"))&&(!v("f-u")||d.u===v("f-u"))&&(!v("f-s")||d.s===v("f-s"))&&(!v("f-t")||d.t===v("f-t"))&&(!v("f-o")||(d.o||"").split("|").indexOf(v("f-o"))>-1)&&(!q||(r._x||(r._x=r.textContent.toLowerCase())).indexOf(q)>-1);r.style.display=ok?"":"none";if(ok)n++;});document.getElementById("f-n").textContent=n;}' +
  'ids.forEach(function(i){var e=document.getElementById(i);if(e)e.addEventListener("change",aplicar);});document.getElementById("f-q").addEventListener("input",aplicar);' +
  'document.getElementById("f-limpar").addEventListener("click",function(){ids.concat("f-q").forEach(function(i){var e=document.getElementById(i);if(e)e.value="";});aplicar();});' +
  'var rk={alta:0,media:1,baixa:2},dir={};[].slice.call(t.tHead.rows[0].cells).forEach(function(th,c){th.title="Clique para ordenar";th.addEventListener("click",function(){dir[c]=!dir[c];var s=dir[c]?1:-1;rows.sort(function(a,b){var x=a.cells[c].textContent.trim().toLowerCase(),y=b.cells[c].textContent.trim().toLowerCase();if(x in rk&&y in rk)return(rk[x]-rk[y])*s;return x.localeCompare(y,"pt-BR")*s;});rows.forEach(function(r){t.tBodies[0].appendChild(r);});});});})();';
function htmlTabelaAchadosFiltravel(lista, cols) {
  if (!cols.length) return '<div class="vazio">Escolha ao menos uma coluna.</div>';
  const ord = lista.slice().sort((x, y) => (ordemGrav[x.gravidade] - ordemGrav[y.gravidade]) || String(x.unidade).localeCompare(String(y.unidade), 'pt-BR'));
  const uniq = f => [...new Set(ord.map(f).filter(Boolean))].sort((p, q) => String(p).localeCompare(String(q), 'pt-BR'));
  const orgsDe = a => { const o = lerOrgaos(a); return o.length ? o : [SEM_ORGAO]; };
  const sel = (id, rot, vals) => `<div><label for="${id}">${rot}</label><select id="${id}"><option value="">Todos</option>${vals.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>`;
  const barra = `<div class="filtros-rel">${sel('f-g', 'Gravidade', uniq(a => a.gravidade))}${sel('f-u', 'Unidade', uniq(a => a.unidade))}${sel('f-s', 'Setor', uniq(a => a.setor || 'Sem setor'))}${sel('f-o', 'Órgão', [...new Set(ord.flatMap(orgsDe))].sort((p, q) => p.localeCompare(q, 'pt-BR')))}${sel('f-t', 'Tipo', uniq(a => a.tipo))}
    <div><label for="f-q">Buscar nas colunas da tabela</label><input id="f-q" type="search" placeholder="palavra ou número"></div>
    <div><label>&nbsp;</label><button type="button" id="f-limpar" class="btn-limpar">Limpar filtros</button></div></div>
    <div class="sub no-print">Mostrando <b id="f-n">${ord.length}</b> de ${ord.length} achados. Clique no título de uma coluna para ordenar. O que ficar na tela é o que sai na impressão.</div>`;
  const cab = cols.map(c => `<th>${esc(COLUNAS[c][0])}</th>`).join('');
  const linhas = ord.map(a => {
    return `<tr data-g="${esc(a.gravidade)}" data-u="${esc(a.unidade)}" data-s="${esc(a.setor || 'Sem setor')}" data-t="${esc(a.tipo)}" data-o="${esc(orgsDe(a).join('|'))}">${cols.map(c => `<td>${COLUNAS[c][2] ? COLUNAS[c][2](a) : esc(COLUNAS[c][1](a))}</td>`).join('')}</tr>`;
  }).join('');
  return `${barra}<table class="rx-tab" id="tab-ach"><thead><tr>${cab}</tr></thead><tbody>${linhas}</tbody></table><script>${SCRIPT_FILTRO_REL}<\/script>`;
}

function htmlDetalhe(lista, agrupar) {
  const chave = a => agrupar === 'setor' ? [a.setor || 'Sem setor'] : agrupar === 'orgao' ? (lerOrgaos(a).length ? lerOrgaos(a) : [SEM_ORGAO]) : [a.unidade || '(sem unidade)'];
  const por = {}; lista.forEach(a => chave(a).forEach(k => { (por[k] = por[k] || []).push(a); }));
  return Object.keys(por).sort((x, y) => por[y].length - por[x].length || x.localeCompare(y, 'pt-BR')).map(k => `<h2>${esc(k)} <small style="font-weight:400;color:#66757d">(${por[k].length})</small></h2>` +
    por[k].sort((x, y) => ordemGrav[x.gravidade] - ordemGrav[y.gravidade]).map(a => `
    <div class="a ${esc(a.gravidade)}"><span class="s ${esc(a.gravidade)}">${esc(a.gravidade)}</span><span class="s e">${esc(a.tipo)}</span><span class="s ${a.conferido === 'sim' ? 'c' : 'p'}">${a.conferido === 'sim' ? 'conferido: procede' : 'a conferir'}</span>${a.papel === 'anterior' ? '<span class="s e">contrato anterior</span>' : a.papel === 'estendido' ? '<span class="s p">estendido</span>' : ''}
    <span style="font-size:.78rem;color:#66757d">${esc(a.unidade)}${a.contrato ? ' · contrato ' + esc(a.contrato) : ''}${a.processo ? ' · processo ' + esc(a.processo) : ''}${a.setor ? ' · ' + esc(a.setor) : ''}</span>
    <h3>${esc(a.titulo)}</h3>${a.descricao ? `<p>${esc(a.descricao)}</p>` : ''}
    ${a.tce_ref ? `<div class="tce"><b>Alerta TCE-PE.</b> Tema já tratado pelo Tribunal de Contas em auditoria de contrato de gestão: ${esc(a.tce_ref)}. Pode ser questionado do mesmo modo; isso não significa que o mesmo fato ocorreu neste contrato.${a.tce_persist ? `<br><b>${a.tce_persist === 'posterior' ? 'Mesmo depois do apontamento do TCE-PE, o tema aparece de novo.' : 'Possível persistência após o TCE-PE.'}</b> ${esc(a.tce_persist_txt)}` : ''}</div>` : ''}
    ${a.liga_passado === 'sim' && a.ligacao ? `<div class="r">Ligação com o passado</div><p>${esc(a.ligacao)}</p>` : ''}
    ${a.sei_contrato ? `<div class="r">Processo SEI</div><p>Contrato: ${esc(a.sei_contrato)}${a.sei_instrumento ? ' · ' + esc(a.instrumento_citado) + ': ' + esc(a.sei_instrumento) : ''}</p>` : ''}
    ${a.documentos ? `<div class="r">Documento</div><p>${esc(a.documentos)}</p>` : ''}${a.trecho ? `<div class="r">Trecho no documento</div><blockquote>${esc(a.trecho)}</blockquote>` : ''}
    ${a.impacto ? `<div class="r">Impacto</div><p>${esc(a.impacto)}</p>` : ''}${a.risco_controle ? `<div class="r">Risco perante os órgãos de controle</div><p>${esc(a.risco_controle)}</p>` : ''}
    ${lerOrgaos(a).length ? `<div class="r">Órgãos que podem se interessar</div><p>${esc(lerOrgaos(a).join(', '))}</p>` : ''}
    ${a.sugestao && a.setor !== 'CCGP' ? `<div class="r">Sugestão</div><p>${esc(a.sugestao)}</p>` : ''}</div>`).join('')).join('');
}

function listaRx() {
  const v = id => ($(id) || {}).value || '';
  return achados.filter(a => visivel(a) && (!v('rx-setor') || (a.setor || 'Sem setor') === v('rx-setor')) && (!v('rx-orgao') || lerOrgaos(a).includes(v('rx-orgao'))) &&
    (!v('rx-grav') || a.gravidade === v('rx-grav')) && (!v('rx-conf') || (v('rx-conf') === 'sim' ? a.conferido === 'sim' : !a.conferido)));
}
function pintarRx() {
  const l = listaRx(), alta = l.filter(a => a.gravidade === 'alta').length, conf = l.filter(a => a.conferido === 'sim').length;
  const contratos = new Set(l.map(a => (a.unidade || '') + '|' + (a.contrato || a.processo || ''))).size;
  $('rx-tiles').innerHTML = `
    <div class="tile"><h3>Achados no filtro</h3><div class="grande">${fmt(l.length)}</div></div>
    <div class="tile"><h3>Gravidade alta</h3><div class="grande">${fmt(alta)}</div></div>
    <div class="tile"><h3>Já conferidos (procedem)</h3><div class="grande">${fmt(conf)}<small>de ${fmt(l.length)}</small></div></div>
    <div class="tile"><h3>Contratos com achados</h3><div class="grande">${fmt(contratos)}</div></div>`;
  $('rx-matriz').innerHTML = htmlMatriz(l, true);
  $('rx-barras').innerHTML = htmlBarras(l, true);
  $('rx-contratos').innerHTML = htmlTabContratos(l);
}

  const css = `body{font-family:Segoe UI,system-ui,sans-serif;color:#1f2a30;margin:0;background:#f4f2ee}main{max-width:1100px;margin:0 auto;padding:24px 20px}
    h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:26px 0 10px;border-bottom:2px solid #b45309;padding-bottom:4px;page-break-after:avoid}.sub{color:#66757d;font-size:.88rem}

    .a h3{font-size:.93rem;margin:4px 0}.r{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#66757d;margin-top:7px}.a p{margin:2px 0;font-size:.84rem;line-height:1.5}
    blockquote{margin:4px 0;background:#f7f5f1;border-left:3px solid #d8cfc0;padding:6px 10px;font-size:.8rem}.s{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:700;margin-right:4px}
    .tce{background:#fdecea;border-left:3px solid #8e1628;padding:6px 10px;font-size:.8rem;margin:6px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .s.alta{background:#f8d7da;color:#8e1628}.s.media{background:#fff4d6;color:#664d03}.s.baixa{background:#e6ecef;color:#455a64}.e{background:#e6ecef;color:#455a64}.c{background:#d9f1e3;color:#0f5132}.p{background:#fff4d6;color:#664d03}
    .msg{background:#fff;border:1px solid #ddd6ca;border-left:4px solid #1f4e79;border-radius:8px;padding:6px 18px 12px;margin:14px 0}.msg .t{white-space:pre-wrap;font-size:.9rem;line-height:1.6}.msg .as{margin-top:10px;font-size:.84rem;color:#455a64}.intro{background:#fff;border:1px solid #ddd6ca;border-left:4px solid #b45309;border-radius:8px;padding:6px 18px 10px;margin:14px 0}.intro p{margin:7px 0;font-size:.86rem;line-height:1.55}.aviso{background:#fff4d6;border-radius:6px;padding:9px 13px;font-size:.82rem;margin:12px 0}.vazio{color:#66757d;padding:10px}
    .filtros-rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}.filtros-rel label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;color:#66757d;margin-bottom:2px}.filtros-rel select,.filtros-rel input{width:100%;padding:7px;font-size:.85rem;border:1px solid #c9c2b6;border-radius:6px;background:#fff;box-sizing:border-box}.btn-limpar{padding:7px 12px;border:1px solid #c9c2b6;border-radius:6px;background:#f4f2ee;cursor:pointer;font-size:.85rem}#tab-ach th{cursor:pointer}@media print{.filtros-rel,.no-print{display:none}}
    @media screen and (max-width:700px){main{padding:14px 10px}table{display:block;overflow-x:auto;max-width:100%}}.barra{position:sticky;top:0;background:#212529;padding:8px 14px;text-align:right;z-index:5}.barra button{background:#d97706;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:700;font-size:.9rem}@media print{.barra{display:none}}
    @page{size:A4 ${v('op-folha') || 'landscape'};margin:12mm}@media print{body{background:#fff}main{max-width:none;padding:0}.a{border-color:#bbb}tr{page-break-inside:avoid}thead{display:table-header-group}}`;
  const msgTxt = v('op-msg-texto').trim();
  const blocoMsg = msgTxt ? `<div class="msg"><h2 style="margin-top:6px">${esc(v('op-msg-titulo') || 'Mensagem')}</h2><div class="t">${esc(msgTxt)}</div><div class="as">${v('op-msg-autor') ? esc(v('op-msg-autor')) + ' — ' : ''}${hoje}</div></div>` : '';
  const sec = [];
  if (op('op-resumo')) sec.push(`<div class="tiles"><div class="tile"><b>${l.length}</b><span>achados</span></div><div class="tile"><b>${alta}</b><span>de gravidade alta</span></div><div class="tile"><b>${conf}</b><span>já conferidos (procedem)</span></div><div class="tile"><b>${new Set(l.map(a => (a.unidade || '') + '|' + (a.contrato || a.processo || ''))).size}</b><span>contratos com achados</span></div>${l.some(a => a.tce_ref) ? `<div class="tile"><b>${l.filter(a => a.tce_ref).length}</b><span>com tema já tratado pelo TCE-PE</span></div>${l.some(a => a.tce_persist) ? `<div class="tile"><b>${l.filter(a => a.tce_persist).length}</b><span>com possível persistência após o TCE-PE</span></div>` : ''}` : ''}</div>`);
  if (op('op-matriz')) sec.push(`<h2>Achados por setor e órgão de controle</h2>${htmlMatriz(l, false)}`);

  if (op('op-contratos')) sec.push(`<h2>Contratos com achados</h2>${htmlTabContratos(l)}`);
  if (op('op-tabela')) sec.push(`<h2>Tabela de achados</h2>${htmlTabelaAchadosFiltravel(l, cols)}`);
  if (op('op-detalhe')) sec.push(htmlDetalhe(l, v('op-agrupar') || 'unidade'));
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raio-X documental — DGMCG/GGPCG</title><style>${CSS_RX}${css}</style></head><body><div class="barra"><button onclick="window.print()">Salvar em PDF / imprimir</button></div><main>
    <h1>Raio-X documental</h1><div class="sub">Inconsistências presentes nos documentos da base, em ${hoje}. DGMCG/GGPCG — SES-PE.${filtros.length ? ' Filtro: ' + esc(filtros.join('; ')) + '.' : ''}</div>
    ${blocoMsg}
    <div class="intro"><h2 style="margin-top:6px">Como ler este relatório</h2>
      <p><b>O que é.</b> O Raio-X é uma ferramenta da DGMCG/GGPCG que lê os contratos de gestão, os aditivos e os processos SEI da nossa base e aponta <b>achados</b>: pontos dos documentos que merecem atenção, porque um órgão de controle poderia questioná-los.</p>
      <p><b>O que é um achado.</b> É um ponto em que os documentos se contradizem, estão incompletos ou fogem de uma regra. Por exemplo: datas que não batem, valores diferentes entre documentos, prorrogação sem o ato anterior, intervalo sem cobertura entre duas vigências. Cada achado traz o trecho do documento onde aparece, o impacto, o risco perante os órgãos de controle e uma sugestão de correção.</p>
      <p><b>O que o relatório não é.</b> Não é auditoria nem conclusão. Ele <b>não afirma</b> que houve dano, irregularidade ou culpa, nem que o ponto deixou de ser corrigido depois: mostra apenas o que consta nos documentos lidos. Também não avalia pessoas; nomes só aparecem se estiverem no trecho citado.</p>
      <p><b>Como foi feito.</b> A leitura combina verificações automáticas e inteligência artificial. Dados pessoais são mascarados antes do envio à IA. O trecho que cada achado cita é conferido contra o texto do documento.</p>
      <p><b>Conferido ou a conferir.</b> A maior parte dos achados foi identificada automaticamente e <b>ainda não foi checada por uma pessoa</b> (etiqueta “a conferir”). Só os marcados “conferido: procede” foram validados pela equipe. Os que a equipe julgou improcedentes não aparecem aqui.</p>
      <p><b>Gravidade.</b> <b>Alta</b>: o ponto pode afetar valor, vigência ou validade do contrato. <b>Média</b> ou <b>baixa</b>: questão de forma.</p>
      <p><b>Setor e órgão.</b> O setor é a área da SES que pode resolver o ponto. O órgão é quem poderia questioná-lo. A matriz cruza os dois e só mostra os órgãos que aparecem nos achados.</p>
      <p><b>Quais contratos entram.</b> Os que estão em vigor, incluindo os emergenciais, termos de compromisso, prorrogações excepcionais e TAC. Do contrato anterior e dos que seguem em operação com o prazo vencido, só entram os achados que ligam ao passado. Encerrados ficam de fora.</p>
      <p><b>Alerta TCE-PE.</b> Alguns achados tratam de temas que o Tribunal de Contas já apontou em auditorias de contratos de gestão da SES (processos 24100082-8 e 25100813-7), como desconto do art. 15-A não aplicado, prorrogação com metas deficitárias, transparência e atuação da CTAI/CMA. O alerta indica que o mesmo tipo de ponto já foi questionado por órgão de controle em outra unidade. Não significa que o mesmo fato ocorreu neste contrato, nem que há irregularidade; a identificação do tema é automática e ainda não foi conferida. Quando o instrumento citado tem processo SEI aberto depois da deliberação do TCE-PE (23/09/2025 e 02/07/2026), o achado traz também um aviso de possível persistência: o ano do SEI indica quando o processo foi aberto, não a data do aditivo, e por isso a data deve ser confirmada.</p>
      <p><b>Limite importante.</b> A leitura depende dos documentos que estão na base. Contrato sem achado pode ser contrato cujos documentos ainda não foram lidos; a ausência de achado não prova que não há problema.</p>
      ${msgTxt ? '' : '<p><b>O que pedimos.</b> Confira os achados do seu setor, veja o trecho citado e informe se o ponto procede, se já foi resolvido ou se há explicação nos autos.</p>'}
      <p class="sub">Uso interno.</p></div>
    ${sec.join('')}<p class="sub" style="margin-top:26px">Gerado pelo Raio-X em ${hoje}. © 2026 SES-PE — DGMCG/GGPCG.</p></main></body></html>`;
}
function imprimirRx() {
  const html = montarRelatorio(), f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { baixarRx(); } setTimeout(() => f.remove(), 120000); };
  document.body.appendChild(f); f.srcdoc = html;
}
function salvarPdfRx() {

}
async function criarLinkRx() {
  const bt = $('bt-link'), box = $('rx-link'); bt.disabled = true; box.innerHTML = '<span class="dica">Criando o link…</span>';
  const res = await api('raiox/relatorio-link', { html: montarRelatorio(), base: API_URL, dias: ($('op-dias') || {}).value === '0' ? 0 : (Number(($('op-dias') || {}).value) || 15) }, 180000);
  bt.disabled = false;
  if (!res.ok) { box.innerHTML = '<div class="aviso">' + esc(res.erro || 'Não consegui criar o link.') + '</div>'; return; }
  const url = API_URL + '?rel=' + res.codigo;
  box.innerHTML = '<div class="aviso">Link criado. ' + (res.sem_prazo ? 'Sem prazo: vale até você desativar em "Meus links criados".' : 'Vale até ' + esc(res.vence_em) + '.') + ' Quem tiver o link abre, sem login. Só envie para quem pode ver.<br><input id="rx-url" readonly value="' + esc(url) + '" style="width:100%;margin-top:6px" onclick="this.select()"><div class="acoes"><button class="btn btn-sm btn-principal" onclick="copiarLinkRx()">Copiar</button> <a class="btn btn-sm btn-claro" href="' + esc(url) + '" target="_blank" rel="noopener">Abrir</a></div></div>';
}
async function listarLinksRx() {
  const box = $('rx-lista'); box.innerHTML = '<span class="dica">Buscando…</span>';
  const res = await api('raiox/relatorio-lista', {});
  if (!res.ok) { box.innerHTML = '<div class="aviso">' + esc(res.erro || 'Não consegui listar.') + '</div>'; return; }
  if (!res.itens.length) { box.innerHTML = '<div class="dica">Nenhum link criado por você.</div>'; return; }
  box.innerHTML = '<table class="tabela"><thead><tr><th>Criado</th><th>Situação</th><th>Ações</th></tr></thead><tbody>' + res.itens.map(i => {
    const sit = i.desativado ? 'Desativado' : (i.vencido ? 'Vencido' : (i.sem_prazo ? 'Ativo, sem prazo' : 'Ativo até ' + i.vence_txt));
    const url = API_URL + '?rel=' + i.codigo;
    return '<tr><td>' + esc(i.criado_txt) + '<br><span class="dica">' + i.kb + ' KB</span></td><td>' + esc(sit) + '</td><td>' +
      '<button class="btn btn-sm btn-claro" onclick="copiarTextoRx(\'' + url + '\')">Copiar link</button> ' +
      (i.desativado ? '<button class="btn btn-sm btn-claro" onclick="acaoLinkRx(\'' + i.codigo + '\',\'reativar\')">Reativar</button> ' : '<button class="btn btn-sm btn-claro" onclick="acaoLinkRx(\'' + i.codigo + '\',\'desativar\')">Desativar</button> ') +
      '<button class="btn btn-sm btn-claro" onclick="acaoLinkRx(\'' + i.codigo + '\',\'excluir\')">Excluir</button></td></tr>';
  }).join('') + '</tbody></table>';
}
async function acaoLinkRx(codigo, acao) {
  if (acao === 'excluir' && !confirm('Excluir este link? Quem o tiver não vai mais conseguir abrir, e não dá para desfazer.')) return;
  if (acao === 'desativar' && !confirm('Desativar este link? Quem o tiver não vai conseguir abrir até você reativar.')) return;
  const res = await api('raiox/relatorio-acao', { codigo: codigo, acao: acao });
  if (!res.ok) { alert(res.erro || 'Não consegui.'); return; }
  listarLinksRx();
}
function copiarTextoRx(t) {
  try { navigator.clipboard.writeText(t); alert('Link copiado.'); } catch (e) { prompt('Copie o link:', t); }
}
function copiarLinkRx() {
  const i = $('rx-url'); i.select();
  try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); }
}
function baixarRx() {
  const blob = new Blob([montarRelatorio()], { type: 'text/html;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Raio-X_documental_' + new Date().toISOString().slice(0, 10) + '.html'; document.body.appendChild(a); a.click(); a.remove();
}

// ==================== AVISO DE VERSÃO NOVA ====================
let _ultimaChecagemVersao = 0;
async function verificarVersaoNova(forcar) {
  if (!forcar && Date.now() - _ultimaChecagemVersao < 5 * 60 * 1000) return;
  _ultimaChecagemVersao = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const t = await r.text(), v = t.match(/const VERSAO_RAIOX\s*=\s*'([^']+)'/), d = t.match(/const VERSAO_RAIOX_DATA\s*=\s*'([^']+)'/);
    if (v && (v[1] !== VERSAO_RAIOX || (d && d[1] !== VERSAO_RAIOX_DATA)) && !document.getElementById('faixa-versao')) {
      const f = document.createElement('div'); f.id = 'faixa-versao';
      f.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:2000;background:#212529;color:#f3f7f9;padding:10px 14px;border-radius:8px;font-size:.85rem;display:flex;gap:10px;align-items:center';
      f.innerHTML = `<span>Há uma versão nova. Salve o que estiver fazendo e atualize.</span><button class="btn btn-sm btn-principal" onclick="location.reload()">Atualizar</button>`;
      document.body.appendChild(f);
    }
  } catch (e) { /* sem rede */ }
}
window.name = 'sei_raiox';
window.addEventListener('load', () => { setTimeout(() => verificarVersaoNova(true), 4000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarVersaoNova(); }); });
window.addEventListener('beforeunload', e => { if (rodando) { e.preventDefault(); e.returnValue = ''; } });
