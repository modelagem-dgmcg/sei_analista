    <a href="#" data-aba="unidades" onclick="abrirAba('unidades'); return false;">Unidades</a>

<script>
// ============================================================
// SEI DOCS — lógica da página
// ============================================================
const VERSAO_DOCS = 'v1.3';
const VERSAO_DOCS_DATA = '13/10/2026 16:00';
const API_URL = 'https://script.google.com/macros/s/AKfycbzzcJEAQPUCwY5YC2o1O5bj500pRE2mOFfZrLCy-e2kFzIgoDkebamJBgQK_yV2Ez0b/exec';
const MAX_ORIGINAL_BYTES = 8 * 1024 * 1024;     // acima disso só o texto vai para a base
const EXT_LIDAS = ['pdf', 'docx', 'html', 'htm', 'txt', 'md', 'csv'];
const MARCAS = ['CPF', 'RG', 'E-MAIL', 'TELEFONE', 'DADO BANCÁRIO', 'MATRÍCULA', 'REPRESENTANTE', 'NOME'];

let TOKEN = null, usuario = null, versaoServidor = '', estado = null, abaAtual = 'alimentar';
let fila = [], seq = 0, lendo = 0;

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const $ = id => document.getElementById(id);
const carregando = t => `<div class="vazio"><span class="spinner"></span>${esc(t || 'Carregando...')}</div>`;
const fmtData = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—';
const fmtDataHora = d => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const nomeTipo = t => (estado && estado.tipos && estado.tipos[t]) || t || '—';
const ehContratual = t => !!(estado && estado.contratuais && estado.contratuais.indexOf(t) > -1);

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function sha256Bytes(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function bufParaB64(buf) {
  let s = ''; const b = new Uint8Array(buf);
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}

// Toda chamada vai por POST com o token no corpo (nunca no endereço).
async function api(acao, corpo, tempoMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), tempoMs || 60000);
  try {
    const r = await fetch(API_URL + '?action=' + encodeURIComponent(acao), {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, signal: ctrl.signal,
      body: JSON.stringify(Object.assign({}, corpo || {}, { token: TOKEN }))
    });
    let res;
    try { res = JSON.parse(await r.text()); } catch (e) { return { ok: false, erro: 'O servidor respondeu de um jeito inesperado. Tente de novo em instantes.' }; }
    if (res && res.sessao_expirada && acao !== 'auth/login') sessaoVencida();
    return res || { ok: false, erro: 'Resposta vazia do servidor.' };
  } catch (e) {
    return { ok: false, erro: e.name === 'AbortError' ? 'O servidor demorou demais para responder. Tente de novo.' : 'Sem conexão com o servidor: ' + e.message };
  } finally { clearTimeout(timer); }
}

function sessaoVencida() {
  TOKEN = null; window.__seiLogado = false;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  const e = $('l-erro'); e.textContent = 'Sua sessão venceu. Entre de novo. (O que estava na tela de "Alimentar" continua aqui até você recarregar a página.)'; e.classList.remove('hidden');
  if (usuario) $('l-usuario').value = usuario.email;
}

async function entrar() {
  const erro = $('l-erro'); erro.classList.add('hidden');
  const email = $('l-usuario').value.trim(), senha = $('l-senha').value;
  if (!email || !senha) { erro.textContent = 'Preencha login e senha.'; erro.classList.remove('hidden'); return; }
  const res = await api('auth/login', { email, senha_hash: await sha256(senha), app: 'docs' });
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível entrar.'; erro.classList.remove('hidden'); return; }
  await _entrarDocs(res);
}

async function _entrarDocs(res) {
  TOKEN = res.token; usuario = res.usuario; versaoServidor = res.versao_backend || '';
  window.__seiLogado = true;
  $('l-senha').value = ''; $('l-erro').classList.add('hidden');
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('quem').textContent = usuario.nome;
  $('rodape-versao').textContent = `Docs ${VERSAO_DOCS} · ${VERSAO_DOCS_DATA} — Servidor ${versaoServidor || 'sem versão (antigo)'}`;
  const apps = Array.isArray(usuario.apps) ? usuario.apps : [];
  $('btn-ir-analista').classList.toggle('hidden', !apps.includes('analista'));
  $('btn-ir-gestao').classList.toggle('hidden', !(apps.includes('gestao') && usuario.perfil === 'admin'));
  await carregarEstado();
  abrirAba(abaAtual || 'alimentar');
}

async function carregarEstado() {
  const r = await api('docs/estado', {});
  if (r.ok) estado = r;
  return r;
}

// ==================== TROCA ENTRE OS APPS (passe de uso único) ====================
async function irParaOutroApp(destino) {
  const nomeAba = destino === 'gestao' ? 'sei_gestao' : 'sei_analista';
  const repo = '/' + (location.pathname.split('/').filter(Boolean)[0] || 'sei_analista') + '/';
  const endereco = location.origin + repo + (destino === 'gestao' ? 'gestao/' : '');
  let aba = null;
  try { aba = window.open('', nomeAba); } catch (e) { aba = null; }
  try { if (aba && aba.__seiLogado) { aba.focus(); return; } } catch (e) { /* ignora */ }
  const res = await api('auth/ponte-criar', { destino });
  if (!res.ok) {
    try { if (aba && aba.location.href === 'about:blank') aba.close(); } catch (e) { /* ignora */ }
    alert('Não foi possível abrir: ' + (res.erro || 'erro desconhecido'));
    return;
  }
  try { localStorage.setItem('sei_ponte', JSON.stringify({ codigo: res.codigo, destino, criado: Date.now() })); } catch (e) { /* ignora */ }
  if (aba) { aba.location.href = endereco; aba.focus(); } else window.location.href = endereco;
}
async function _entrarComPasse(app) {
  let passe = null;
  try { passe = JSON.parse(localStorage.getItem('sei_ponte') || 'null'); } catch (e) { passe = null; }
  if (!passe || passe.destino !== app) return false;
  try { localStorage.removeItem('sei_ponte'); } catch (e) { /* ignora */ }
  if (Date.now() - Number(passe.criado || 0) > 60000) return false;
  const res = await api('auth/ponte-usar', { codigo: passe.codigo, app });
  if (!res.ok) { const e = $('l-erro'); e.textContent = res.erro || 'Entre com login e senha.'; e.classList.remove('hidden'); return false; }
  await _entrarDocs(res);
  return true;
}

let _ultimaChecagemVersao = 0;
function _mostrarFaixaVersaoNova(rotulo) {
  if (document.getElementById('faixa-versao-nova')) return;
  const f = document.createElement('div');
  f.id = 'faixa-versao-nova';
  f.style.cssText = 'position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:2000; background:#14232b; color:#f3f7f9; padding:10px 14px; border-radius:8px; font-size:0.85rem; display:flex; gap:12px; align-items:center; flex-wrap:wrap; box-shadow:0 4px 14px rgba(0,0,0,.3);';
  f.innerHTML = `<span>Há uma versão nova (${esc(rotulo)}). Salve o que estiver fazendo e atualize.</span>
    <button class="btn btn-sm btn-principal" onclick="location.reload()">Atualizar</button>
    <button class="btn btn-sm" onclick="document.getElementById('faixa-versao-nova').remove()">Depois</button>`;
  document.body.appendChild(f);
}
async function verificarVersaoNova(forcar) {
  if (!forcar && Date.now() - _ultimaChecagemVersao < 5 * 60 * 1000) return;
  _ultimaChecagemVersao = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const t = await r.text();
    const v = t.match(/const VERSAO_DOCS\s*=\s*'([^']+)'/), d = t.match(/const VERSAO_DOCS_DATA\s*=\s*'([^']+)'/);
    if (v && (v[1] !== VERSAO_DOCS || (d && d[1] !== VERSAO_DOCS_DATA))) _mostrarFaixaVersaoNova(v[1] + (d ? ' · ' + d[1] : ''));
  } catch (e) { /* sem rede: tenta de novo mais tarde */ }
}
window.name = 'sei_docs';
window.addEventListener('load', () => {
  _entrarComPasse('docs');
  setTimeout(() => verificarVersaoNova(true), 4000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarVersaoNova(); });
  try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'; } catch (e) { /* PDF indisponível */ }

// ==================== MASCARAMENTO (o mesmo código do servidor) ====================
// (copiado de Docs.gs: o servidor mascara com a mesma função; um teste confere que as duas dão o mesmo resultado)
function docsMascarar_(texto, nomesExtra) {
  let txt = String(texto || ''), n = 0;
  const por = {};
  const conta = marca => { n++; por[marca] = (por[marca] || 0) + 1; };
  const troca = (re, marca) => { txt = txt.replace(re, () => { conta(marca); return marca; }); };
  const trocaComRotulo = (re, marca) => { txt = txt.replace(re, (m, rotulo) => { conta(marca); return rotulo + marca; }); };

  // 1) bloco de qualificação do representante: da âncora até o fim da frase (no máximo 220 caracteres)
  const ANC = /(neste\s+ato\s+representad[oa]\s+por|representad[oa]\s+neste\s+ato\s+por|por\s+seu[a]?\s+representante\s+legal[,:]?)/gi;
  let saida = '', pos = 0, m;
  while ((m = ANC.exec(txt))) {
    const ini = m.index + m[0].length, resto = txt.substr(ini, 220), k = resto.search(/[.;]\s/), tam = k >= 0 ? k : resto.length;
    if (tam < 3) { ANC.lastIndex = ini; continue; }
    saida += txt.slice(pos, ini) + ' [REPRESENTANTE]'; pos = ini + tam; ANC.lastIndex = pos; conta('[REPRESENTANTE]');
  }
  txt = saida + txt.slice(pos);

  // 2) documentos e contatos
  troca(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g, '[CPF]');
  trocaComRotulo(/(\bCPF\b[^\d\n]{0,12})\d{11}\b/gi, '[CPF]');
  troca(/\b\d{1,2}\.\d{3}\.\d{3}-[\dxX]\b/g, '[RG]');
  trocaComRotulo(/((?:\bRG\b|\bidentidade\b)[^\d\n]{0,15})[\d][\d.\-xX]{4,13}/gi, '[RG]');
  troca(/[\w.+-]+@[\w-]+\.[\w.-]+/g, '[E-MAIL]');
  troca(/\+55\s?\(?\d{2}\)?\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  troca(/\(\d{2}\)\s?9?\d{4}-?\d{4}\b/g, '[TELEFONE]');
  trocaComRotulo(/((?:\btel(?:efone)?\b\.?|\bcel(?:ular)?\b\.?|\bfone\b)[^\d\n]{0,8})\d{2}\s?9?\d{4}-?\d{4}\b/gi, '[TELEFONE]');
  troca(/\b(?:ag[êe]ncia|conta\s+corrente|conta\s+poupan[çc]a|conta\s+banc[áa]ria|c\/c)\s*(?:n[º°o.]*)?\s*:?\s*\d{3,10}(?:-\d)?\b/gi, '[DADO BANCÁRIO]');
  troca(/\bmatr[íi]cula\s*(?:n[º°o.]*)?\s*:?\s*\d[\d.\-]{3,11}\b/gi, '[MATRÍCULA]');

  // 3) nomes que a pessoa pediu para mascarar neste documento
  (nomesExtra || []).forEach(nome => {
    const t = String(nome || '').trim();
    if (t.length < 3) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'), 'gi');
    troca(re, '[NOME]');
  });
  return { texto: txt, trocas: n, por_tipo: por };
}

// Nomes de pessoas que o mascarador automático não pega: aparecem como sugestão para a pessoa mandar mascarar.
function acharNomesProvaveis(texto) {
  const re = /\b(?:Sr\.?|Sra\.?|Dr\.?|Dra\.?|Prof\.?|Profa\.?|Secret[áa]ri[oa]|Diretor[a]?|Presidente|Gerente|Coordenador[a]?|Superintendente)\s+(?:d[aeo]s?\s+)?([A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]+(?:\s+(?:d[aeo]s?\s+)?[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç]+){1,4})/g;
  const achados = new Set(); let m;
  while ((m = re.exec(texto)) && achados.size < 8) achados.add(m[1]);
  return [...achados];
}

// ==================== LEITURA DE ARQUIVO ====================
function _reconstruirLinhasPDF(items) {
  if (!items.length) return '';
  const linhas = [];
  items.forEach(item => {
    const y = item.transform ? item.transform[5] : 0, x = item.transform ? item.transform[4] : 0;
    let linha = linhas.find(l => Math.abs(l.y - y) <= 2);
    if (!linha) { linha = { y, itens: [] }; linhas.push(linha); }
    linha.itens.push({ x, str: item.str });
  });
  linhas.sort((a, b) => b.y - a.y);
  return linhas.map(l => l.itens.sort((a, b) => a.x - b.x).map(it => it.str).join(' ')).join('\n');
}
async function lerTexto(nome, buf) {
  const ext = (nome.toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('O leitor de PDF não carregou. Confira a internet e recarregue a página.');
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    let txt = '';
    for (let i = 1; i <= pdf.numPages; i++) { const pg = await pdf.getPage(i); txt += _reconstruirLinhasPDF((await pg.getTextContent()).items) + '\n\n'; }
    return txt;
  }
  if (ext === 'docx') {
    if (typeof mammoth === 'undefined') throw new Error('O leitor de Word não carregou. Confira a internet e recarregue a página.');
    return (await mammoth.extractRawText({ arrayBuffer: buf })).value || '';
  }
  if (ext === 'html' || ext === 'htm') {
    const doc = new DOMParser().parseFromString(new TextDecoder('utf-8', { fatal: false }).decode(buf), 'text/html');
    doc.querySelectorAll('script,style').forEach(n => n.remove());
    doc.querySelectorAll('br').forEach(n => n.replaceWith('\n'));
    doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6,section,article,table,blockquote').forEach(n => n.append('\n'));
    doc.querySelectorAll('td,th').forEach(n => n.append(' '));
    return (doc.body ? doc.body.textContent : '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  if (['txt', 'md', 'csv'].includes(ext)) return new TextDecoder('utf-8', { fatal: false }).decode(buf);
  throw new Error('Tipo de arquivo não suportado (use PDF, Word .docx, HTML do SEI, texto ou .zip).');
}

// ==================== SUGESTÃO DOS CAMPOS (o sistema sugere; quem confirma é a pessoa) ====================
const _ORD = { primeiro: 1, segundo: 2, terceiro: 3, quarto: 4, quinto: 5, sexto: 6, setimo: 7, oitavo: 8, nono: 9, decimo: 10 };
const _MESES = { janeiro: 1, fevereiro: 2, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function _isoDeBR(d, m, a) { a = String(a); if (a.length === 2) a = '20' + a; const iso = `${a}-${('0' + m).slice(-2)}-${('0' + d).slice(-2)}`; const t = new Date(iso + 'T12:00:00Z'); return (!isNaN(t) && t.toISOString().slice(0, 10) === iso) ? iso : ''; }
function _datasDoTexto(txt) {
  const achadas = [];
  for (const m of txt.matchAll(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g)) { const iso = _isoDeBR(m[1], m[2], m[3]); if (iso) achadas.push({ pos: m.index, iso }); }
  for (const m of txt.matchAll(/\b(\d{1,2})\s+de\s+([A-Za-zçÇãÃéÉ]+)\s+de\s+(\d{4})\b/gi)) { const mes = _MESES[norm(m[2])]; if (mes) { const iso = _isoDeBR(m[1], mes, m[3]); if (iso) achadas.push({ pos: m.index, iso }); } }
  return achadas.sort((a, b) => a.pos - b.pos);
}
// Procura no começo do texto um nome com cara de unidade de saúde ("Hospital Regional Emília Câmara", "UPAE Goiana"...).
function unidadePorTexto(texto) {
  const ini = texto.slice(0, 2500), re = /\b(hospital|upae|upa|policl[ií]nica|maternidade|hemocentro|hemope)\b/gi;
  const ehNome = w => /^[A-ZÀ-Ú]/.test(w) && w.length > 1, lig = w => /^(d[aoe]s?|e)$/i.test(w);
  let m;
  while ((m = re.exec(ini))) {
    const resto = ini.slice(m.index + m[0].length).split(/[\n(),;:.]| - | – /)[0], pal = resto.trim().split(/\s+/).filter(Boolean), nome = [m[0]];
    for (const w of pal) { if (nome.length > 7) break; if (ehNome(w) || (lig(w) && nome.length > 1)) nome.push(w); else break; }
    while (nome.length > 1 && lig(nome[nome.length - 1])) nome.pop();
    let out = nome.join(' ');
    if (out === out.toUpperCase()) out = out.toLowerCase().split(' ').map((w, i) => (i > 0 && lig(w)) ? w : (/^upae?$/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))).join(' ');
    if (nome.length >= 2 && !/^hospital\s+d[oa]s?\s+(tricenten|martiniano)/i.test(out) && !/^(hospital|upa|upae)$/i.test(out)) return out;
  }
  return '';
}

function sugerirCampos(nome, texto, unidades, mapa) {
  const s = {}, base = nome.replace(/\.[a-z0-9]+$/i, '');
  const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);
  const titulo = linhas.slice(0, 3).join(' ').slice(0, 300), inicio = texto.slice(0, 3000);
  const nNome = norm(base), nTit = norm(titulo);
  const TIPOS = [['rerratificacao', /rerratifica/], ['apostilamento', /apostila/], ['aditivo', /\baditivo\b/], ['contrato', /contrato de gestao/], ['parecer', /\bparecer\b/],
    ['nota_tecnica', /nota tecnica/], ['oficio', /\boficio\b/], ['relatorio', /\brelatorio\b/], ['despacho', /\bdespacho\b/], ['decreto', /\bdecreto\b/], ['portaria', /\bportaria\b/], ['lei', /\blei (n|complementar|federal|estadual|ordinaria)/]];
  for (const alvo of [nNome, nTit]) { const t = TIPOS.find(([, re]) => re.test(alvo)); if (t) { s.tipo_doc = t[0]; break; } }
  if (!s.tipo_doc && /(^|\n)\s*(assunto|de|para)\s*:/i.test(texto.slice(0, 500)) && /@/.test(texto.slice(0, 800))) s.tipo_doc = 'email';

  // número do documento: olha primeiro o título que está dentro do texto (a primeira linha), depois o nome do arquivo
  const tit1 = linhas.slice(0, 2).join(' ').slice(0, 200);
  const PALAVRAS = '(?:aditivo|apostilamento|parecer|nota\\s+t[ée]cnica|of[ií]cio|despacho|relat[óo]rio|portaria|decreto|lei)';
  const reNum = new RegExp('\\b' + PALAVRAS + '\\b[^\\n\\d]{0,25}?(?:n[º°o.]*\\s*)?(\\d{1,3}(?:\\.\\d{3})+(?:\\s*\\/\\s*\\d{2,4})?|\\d{1,6}(?:\\s*\\/\\s*\\d{2,4})?)', 'i');
  for (const fonteNum of [tit1, base]) {
    let m = fonteNum.match(/(\d{1,2})\s*[ºo°ª]\s*(?:termo|apostil|rerrat)/i);
    if (m) s.numero_doc = m[1] + 'º';
    if (!s.numero_doc) { m = norm(fonteNum).match(/\b(primeiro|segundo|terceiro|quarto|quinto|sexto|setimo|oitavo|nono|decimo)\s+(?:termo|apostil|rerrat)/); if (m) s.numero_doc = _ORD[m[1]] + 'º'; }
    if (!s.numero_doc) { m = fonteNum.match(reNum); if (m && !/^(19|20)\d{2}$/.test(m[1])) s.numero_doc = m[1].replace(/\s+/g, ''); }   // um ano solto ("relatório 2025") não é número
    if (s.numero_doc) break;
  }
  if (!s.numero_doc) { const m = base.match(/_(\d{1,5})$/); if (m) s.numero_doc = m[1]; }
  if (s.tipo_doc === 'contrato' || s.tipo_doc === 'email') delete s.numero_doc;

  // contrato (003/2021)
  m = inicio.match(/contrato\s+de\s+gest[ãa]o\s*(?:n[º°o.]*)?\s*(\d{1,4})\s*\/\s*(\d{4})/i) || base.match(/^\s*(\d{1,4})\s*[\/-]\s*(\d{4})\s*-/);
  if (m) s.contrato = ('000' + m[1]).slice(-Math.max(3, m[1].length)) + '/' + m[2];

  // unidade: nome no padrão "003/2021 - UPAE GOIANA" ou uma unidade que a base já conhece citada no começo do texto
  m = base.match(/^\s*\d{1,4}\s*[\/-]\s*\d{4}\s*-\s*(.+)$/);
  if (m) s.unidade = m[1].split(/\s+[-–—]\s+/)[0].trim();   // "003/2021 - UPAE GOIANA - Contrato" -> "UPAE GOIANA"
  if (!s.unidade && s.contrato && mapa && mapa[s.contrato]) { s.unidade = mapa[s.contrato]; s._origem_unidade = 'contrato'; }   // o contrato já é conhecido na base: a unidade vem dele
  if (!s.unidade && unidades && unidades.length) {
    const alvo = ' ' + norm(base + ' ' + texto.slice(0, 2500)) + ' ';
    const casou = unidades.filter(u => norm(u).length >= 4 && alvo.includes(' ' + norm(u) + ' ')).sort((a, b) => norm(b).length - norm(a).length)[0];
    if (casou) s.unidade = casou;
  }
  if (!s.unidade) { const u = unidadePorTexto(texto); if (u) { s.unidade = u; s._origem_unidade = 'texto'; } }   // nome novo, achado no texto: o sistema pede uma confirmação
  // data do documento: a última data depois de "Recife," (rodapé da assinatura); senão a primeira data do texto
  const datas = _datasDoTexto(texto);
  const recife = [...texto.matchAll(/Recife[,\s]+(?:aos\s+)?/gi)].map(x => x.index + x[0].length);
  const depoisRecife = datas.filter(d => recife.some(r => d.pos >= r && d.pos - r < 8)).pop();
  if (depoisRecife) s.data_doc = depoisRecife.iso; else { const cedo = datas.find(d => d.pos < 700); if (cedo) s.data_doc = cedo.iso; }   // sem data de assinatura: só aceita uma data logo no começo; datas soltas pelo meio do texto enganam
  // vigência: "vigência ... de 01/03/2021 a 01/03/2022"
  m = texto.match(/vig[êe]ncia[^.]{0,100}?(\d{1,2}\/\d{1,2}\/\d{4})[^.\d]{0,40}?(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (m) { const a = m[1].split('/'), b = m[2].split('/'); const i1 = _isoDeBR(a[0], a[1], a[2]), i2 = _isoDeBR(b[0], b[1], b[2]); if (i1 && i2) { s.vigencia_ini = i1; s.vigencia_fim = i2; } }
  m = texto.match(/\d{4,}\s*\.\s*\d{5,6}\s*\/\s*\d{4}\s*-\s*\d{2}/);
  if (m) s.processo_sei = m[0].replace(/\s+/g, '');
  return s;
}

async function telaVolume(aviso) {
  const c = $('conteudo');

  if (!r.ok) { c.innerHTML = `<div class="bloco"><div class="erro">${esc(r.erro || 'Não consegui medir a base.')}</div></div>`; return; }
  const cap = r.capacidade, b = r.base, lei = r.leitura, car = r.carga, cont = r.contagem;
  const nCap = _nivel(cap.pct, 50, 80);
  const msLei = lei.ms || 0, nLei = msLei >= lei.atencao_ms ? 'critico' : msLei >= lei.atencao_ms / 2 ? 'atencao' : 'ok';
  const pctLei = Math.min(100, Math.round(msLei * 100 / lei.atencao_ms));
  const eAdmin = usuario && usuario.perfil === 'admin';

  const tileCarga = car
    ? `<div class="tile"><h3>Carga da pasta LEIS E DECRETOS</h3>
        <div class="grande">${_pct(car.pct)}<small>${_fmt(car.na_base)} de ${_fmt(car.legiveis)} arquivos</small></div>
        <div class="barra" role="img" aria-label="Carga: ${_pct(car.pct)}"><i style="width:${car.pct}%"></i></div>
        <div class="nota">Faltam <b>${_fmt(car.falta)}</b> arquivos legíveis (Google Docs, PDF e Word) para entrar pelo app.${car.contagem_parcial ? ' <b>A contagem foi parcial: o total real é maior.</b>' : ''}<br>Última contagem: ${esc(new Date(cont.quando).toLocaleString('pt-BR'))}.</div></div>`
    : `<div class="tile"><h3>Carga da pasta LEIS E DECRETOS</h3><div class="grande">—</div>
        <div class="nota">Ainda não contei os arquivos da pasta. ${eAdmin ? 'Clique em "Contar a pasta" abaixo.' : 'A gestão precisa rodar a contagem.'}</div></div>`;

  const tipos = Object.keys(b.por_tipo).sort((x, y) => b.por_tipo[y] - b.por_tipo[x]);
  const maxT = Math.max(1, ...tipos.map(k => b.por_tipo[k]));
  const nomeTipo = k => ((estado && estado.tipos && estado.tipos[k]) || k);
  const linhasTipo = tipos.length ? tipos.map(k => `<div class="linha-tipo" title="${esc(nomeTipo(k))}: ${_fmt(b.por_tipo[k])}"><span>${esc(nomeTipo(k))}</span><div class="barra"><i style="width:${Math.round(b.por_tipo[k] * 100 / maxT)}%"></i></div><b>${_fmt(b.por_tipo[k])}</b></div>`).join('') : '<div class="vazio">Nenhum documento entrou ainda.</div>';

  let evol = '<div class="vazio">A evolução aparece a partir do segundo dia em que esta aba for aberta.</div>';
  const h = r.historico || [];
  if (h.length >= 2) {
    const W = 600, H = 130, mx = Math.max(1, ...h.map(x => x.docs)), px = i => 34 + i * (W - 44) / (h.length - 1), py = v => 10 + (H - 30) * (1 - v / mx);
    const pts = h.map((x, i) => `${px(i).toFixed(1)},${py(x.docs).toFixed(1)}`).join(' ');
    evol = `<div class="evolucao"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Documentos na base por dia">
      <line x1="34" y1="${py(0)}" x2="${W - 10}" y2="${py(0)}" stroke="#d9e0e4"/><line x1="34" y1="${py(mx)}" x2="${W - 10}" y2="${py(mx)}" stroke="#eef2f4"/>
      <text x="30" y="${py(mx) + 3}" text-anchor="end">${_fmt(mx)}</text><text x="30" y="${py(0) + 3}" text-anchor="end">0</text>
      <polyline points="${pts}" fill="none" stroke="#0e7490" stroke-width="2"/>
      ${h.map((x, i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(x.docs).toFixed(1)}" r="4" fill="#0e7490" stroke="#fff" stroke-width="2"><title>${esc(x.d.split('-').reverse().join('/'))}: ${_fmt(x.docs)} documentos</title></circle>`).join('')}
      <text x="34" y="${H - 4}">${esc(h[0].d.split('-').reverse().join('/'))}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${esc(h[h.length - 1].d.split('-').reverse().join('/'))}</text></svg></div>`;
  }

  c.innerHTML = `${aviso || ''}
    <div class="tiles">
      <div class="tile"><h3>Documentos na base</h3><div class="grande">${_fmt(b.documentos)}<small>${_fmt(b.trechos)} trechos</small></div>
        <div class="nota">Cerca de ${_fmt(Math.round(b.caracteres / 1000))} mil caracteres de texto já mascarado.</div></div>
      <div class="tile"><h3>Espaço usado da planilha</h3><div class="grande">${_pct(cap.pct)}<small>${_fmt(cap.celulas_usadas)} de ${_fmt(cap.limite)} células</small></div>
        <div class="barra ${nCap}" role="img" aria-label="Espaço usado: ${_pct(cap.pct)}"><i style="width:${Math.min(100, cap.pct)}%"></i></div>${_estado(nCap)}
        <div class="nota">É o teto da planilha do Google. Perto de 80%, vale conversar com a TI sobre um banco maior.</div></div>
      ${tileCarga}
      <div class="tile"><h3>Velocidade da busca</h3><div class="grande">${msLei < 1000 ? _fmt(msLei) + ' ms' : (msLei / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' s'}<small>para ler toda a base</small></div>
        <div class="barra ${nLei}" role="img" aria-label="Leitura: ${msLei} ms"><i style="width:${pctLei}%"></i></div>${_estado(nLei)}
        <div class="nota">Referência nossa, não um limite do Google: acima de ${lei.atencao_ms / 1000} s a pesquisa começa a ficar pesada.</div></div>
    </div>
    <div class="bloco"><h2><i class="ti ti-files"></i> Documentos por tipo</h2>${linhasTipo}</div>
    <div class="bloco"><h2><i class="ti ti-chart-line"></i> Evolução <small>documentos na base, por dia</small></h2>${evol}</div>
    ${eAdmin ? `<div class="bloco"><h2><i class="ti ti-folder-search"></i> Contar a pasta <small>só a gestão</small></h2>
      <div class="dica">Conta os arquivos da pasta LEIS E DECRETOS (com as subpastas) para calcular o andamento da carga. Em pastas grandes pode levar alguns minutos.</div>
      <div class="acoes"><button class="btn btn-claro" onclick="contarPasta()"><i class="ti ti-chart-bar"></i> Contar a pasta LEIS E DECRETOS</button>
        <button class="btn btn-claro" onclick="testarPasta()" title="Confere se o sistema consegue gravar na pasta do Drive"><i class="ti ti-folder-check"></i> Testar a pasta do Drive</button></div>
      <div id="msg-contagem"></div>
      ${cont && cont.por_pasta && cont.por_pasta.length ? `<details style="margin-top:10px"><summary>Arquivos por pasta na última contagem</summary><div class="rolagem"><table class="tabela" style="margin-top:6px"><thead><tr><th>Pasta</th><th style="text-align:right">Arquivos</th></tr></thead><tbody>${cont.por_pasta.map(x => `<tr><td>${esc(x.pasta)}</td><td style="text-align:right">${_fmt(x.arquivos)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    </div>` : ''}`;
}

async function contarPasta() {
  const m = $('msg-contagem');
  m.innerHTML = `<div class="aviso" style="margin-top:10px">${carregando('Contando os arquivos da pasta. Pode levar alguns minutos se a pasta for grande...').replace('class="vazio"', '')}</div>`;
  const r = await api('docs/contar-pasta', {}, 330000);
  if (!r.ok) { m.innerHTML = `<div class="erro" style="margin-top:10px">${esc(r.erro || 'Não consegui contar a pasta.')}</div>`; return; }
  const t = r.tipos || {};
  const lista = [['Google Docs', t.google_docs], ['PDF', t.pdf], ['Word', t.word], ['Planilhas', t.planilha], ['Imagens', t.imagem], ['Outros', t.outros]].filter(x => x[1]).map(x => `${x[0]}: <b>${_fmt(x[1])}</b>`).join(' · ');
  telaVolume(`<div class="ok-msg" style="display:block;margin-bottom:14px"><b>${_fmt(r.total_arquivos)} arquivos</b> em ${_fmt(r.pastas)} pastas${r.parcial ? ' <b>(contagem parcial: a pasta é grande e a varredura parou no limite de tempo)</b>' : ''}.<br>${lista}<br>Google Docs já lidos pelo Acervo antigo (fora da busca daqui): <b>${_fmt(r.google_docs_ja_lidos_pelo_acervo)}</b>.</div>`);
}

async function testarPasta() {
  const m = $('msg-contagem') || $('msg-lote'); m.innerHTML = `<div class="aviso">${carregando('Testando a gravação na pasta do Drive...').replace('class="vazio"', '')}</div>`;
  const r = await api('docs/testar-pasta', {});
  if (r.ok && r.pasta_ok) m.innerHTML = `<div class="ok-msg"><i class="ti ti-check"></i> O sistema consegue gravar na pasta do Drive ("${esc(r.nome)}").</div>`;
  else m.innerHTML = `<div class="erro">O sistema <b>não</b> conseguiu gravar na pasta do Drive: ${esc(r.motivo || r.erro || 'motivo desconhecido')}.<br>Sem isso, os documentos entram na base só como texto, sem o arquivo original. Para resolver, dê permissão de <b>edição</b> na pasta "LEIS E DECRETOS" à conta Google que publica o Apps Script.</div>`;
}

async function receberArquivos(lista) {
  const arquivos = Array.from(lista || []);
  if (!arquivos.length) return;
  for (const f of arquivos) {
    if (/\.zip$/i.test(f.name)) {
      try {
        if (typeof JSZip === 'undefined') throw new Error('O leitor de .zip não carregou. Recarregue a página.');
        const zip = await JSZip.loadAsync(f);
        const nomes = Object.keys(zip.files).filter(k => !zip.files[k].dir && !/(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)/i.test(k));
        for (const n of nomes) {
          const ext = (n.toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
          const base = n.split('/').pop();
          if (!EXT_LIDAS.includes(ext)) { fila.push({ id: ++seq, nome: base, tamanho: 0, estado: 'erro', erro: 'Tipo de arquivo não suportado dentro do .zip.', campos: {}, sug: {}, nomes: '' }); continue; }
          await processarUm(base, await zip.files[n].async('arraybuffer'));
        }
      } catch (e) { fila.push({ id: ++seq, nome: f.name, tamanho: f.size, estado: 'erro', erro: 'Não consegui abrir o .zip: ' + e.message, campos: {}, sug: {}, nomes: '' }); pintarFila(); }
    } else await processarUm(f.name, await f.arrayBuffer());
  }
}

async function processarUm(nome, buf) {
  const item = { id: ++seq, nome, tamanho: buf.byteLength, estado: 'lendo', erro: '', campos: { tipo_doc: '', numero_doc: '', contrato: '', unidade: '', data_doc: '', vigencia_ini: '', vigencia_fim: '', processo_sei: '', assunto: '' }, sug: {}, nomes: '', texto: '', masc: null, hash: '', b64: '' };
  fila.push(item); pintarFila();
  try {
    item.hash = await sha256Bytes(buf);
    const outro = fila.find(x => x !== item && x.hash === item.hash && x.estado !== 'erro');
    if (outro) throw new Error('É o mesmo arquivo que "' + outro.nome + '", já está na lista.');
    item.texto = (await lerTexto(nome, buf)).replace(/\u0000/g, '');
    if (item.texto.trim().length < 40) throw new Error('Nenhum texto foi lido. Se for um PDF escaneado (imagem), esta versão ainda não faz leitura por OCR.');
    if (item.tamanho <= MAX_ORIGINAL_BYTES) item.b64 = bufParaB64(buf);
    const sug = sugerirCampos(nome, item.texto, (estado && estado.unidades) || [], (estado && estado.contratos_unidades) || {});
    item.origemUnidade = sug._origem_unidade || ''; delete sug._origem_unidade;
    Object.assign(item.campos, sug);
    Object.keys(item.campos).forEach(k => { if (item.campos[k]) item.sug[k] = true; });
    remascarar(item);
    item.estado = 'pronto'; avaliar(item);
  } catch (e) { item.estado = 'erro'; item.erro = e.message || String(e); item.texto = ''; item.b64 = ''; }
  pintarFila();
  if (item.estado === 'pronto' && item.nivel === 'auto' && autoSalvar && TOKEN) await salvarItem(item.id);
  await new Promise(r => setTimeout(r, 0));
}

// 'auto' = o sistema reconheceu o bastante e pode guardar; 'confirmar' = achou a unidade no texto e quer um aval; 'manual' = falta algo.
function avaliar(item) {
  const c = item.campos, contr = ehContratual(c.tipo_doc);
  item.faltas = [];
  if (!c.tipo_doc) item.faltas.push('tipo_doc');
  if (contr && !(c.unidade || '').trim()) item.faltas.push('unidade');
  if (item.faltas.length) item.nivel = 'manual';
  else if (contr && item.origemUnidade === 'texto' && item.sug.unidade) item.nivel = 'confirmar';
  else item.nivel = 'auto';
  return item.nivel;
}

function remascarar(item) {
  const nomes = item.nomes.split('\n').map(x => x.trim()).filter(Boolean);
  item.masc = docsMascarar_(item.texto, nomes);
  item.provaveis = acharNomesProvaveis(item.masc.texto).filter(n => !nomes.some(x => norm(x) === norm(n)));
}

function realcarMarcas(texto) {
  const re = new RegExp('\\[(' + MARCAS.join('|').replace(/-/g, '\\-') + ')\\]', 'g');
  return esc(texto).replace(re, (m) => `<mark class="m">${m}</mark>`);
}

function chipsDoItem(i) {
  const c = i.campos, nomeTipo = (estado && estado.tipos && estado.tipos[c.tipo_doc]) || '';
  const partes = [];
  if (nomeTipo) partes.push(`<span class="etq azul">${esc(nomeTipo)}${c.numero_doc ? ' ' + esc(c.numero_doc) : ''}</span>`);
  if (c.contrato) partes.push(`<span class="etq">Contrato ${esc(c.contrato)}</span>`);
  if (c.unidade) partes.push(`<span class="etq">${esc(c.unidade)}</span>`);
  if (c.data_doc) partes.push(`<span class="etq">${esc(c.data_doc.split('-').reverse().join('/'))}</span>`);
  if (c.processo_sei) partes.push(`<span class="etq">SEI ${esc(c.processo_sei)}</span>`);
  if (i.masc && i.masc.trocas) partes.push(`<span class="etq verde" title="Dados pessoais trocados por marcas antes de sair deste computador">${i.masc.trocas} dado(s) protegido(s)</span>`);
  return `<div class="chips">${partes.join('') || '<span class="vazio">Nada reconhecido ainda.</span>'}</div>`;
}

function camposCompletos(i) {
  const c = i.campos, dis = i.estado === 'salvando' ? 'disabled' : '';
  const campo = (k, rot, tipo, extra) => `<div ${extra && extra.largo ? 'class="largo"' : ''}><label>${rot}</label><input ${dis} type="${tipo || 'text'}" value="${esc(c[k] || '')}" class="${i.sug[k] ? 'sug' : ''}" ${extra && extra.lista ? 'list="' + extra.lista + '"' : ''} ${extra && extra.ph ? 'placeholder="' + esc(extra.ph) + '"' : ''} oninput="mudarCampo(${i.id},'${k}',this)"></div>`;
  const tipos = Object.keys((estado && estado.tipos) || {}).map(t => `<option value="${t}" ${c.tipo_doc === t ? 'selected' : ''}>${esc(estado.tipos[t])}</option>`).join('');
  const contr = ehContratual(c.tipo_doc);
  return `<div class="campos">
      <div><label>Tipo do documento *</label><select ${dis} class="${i.sug.tipo_doc ? 'sug' : ''}" onchange="mudarCampo(${i.id},'tipo_doc',this); pintarItem(${i.id})"><option value="">Escolha…</option>${tipos}</select></div>
      ${campo('numero_doc', 'Nº do documento', 'text', { ph: 'Ex.: 2º ou 309/2025' })}
      ${campo('contrato', 'Nº do contrato', 'text', { ph: 'Ex.: 003/2021' })}
      ${campo('unidade', contr ? 'Unidade *' : 'Unidade', 'text', { lista: 'lista-unidades' })}
      ${campo('data_doc', 'Data do documento', 'date')}
      ${contr ? campo('vigencia_ini', 'Vigência: início', 'date') + campo('vigencia_fim', 'Vigência: fim', 'date') : ''}
      ${campo('processo_sei', 'Processo SEI', 'text', { ph: 'Ex.: 2300000266.008100/2026-89' })}
      ${campo('assunto', 'Assunto (opcional)', 'text', { largo: true })}
    </div>`;
}

function blocoProtegido(i) {
  const dis = i.estado === 'salvando' ? 'disabled' : '';
  const trocas = i.masc.trocas, porTipo = Object.keys(i.masc.por_tipo).map(k => `${i.masc.por_tipo[k]}× ${k.replace(/[\[\]]/g, '')}`).join(', ');
  const provaveis = (i.provaveis || []).map(n => `<span class="chip" onclick="mascararNome(${i.id}, this.dataset.n)" data-n="${esc(n)}" title="Clique para mascarar este nome neste documento">${esc(n)} +</span>`).join('');
  return `<div class="masc">
      <b>${trocas ? trocas + ' dado(s) pessoal(is) protegido(s)' + (porTipo ? ' (' + esc(porTipo) + ')' : '') : 'Nenhum dado pessoal encontrado pelo mascarador'}</b>
      ${provaveis ? `<div class="aviso" style="margin-top:8px;">Parecem nomes de pessoas, que o mascarador não apaga sozinho. Clique para mascarar: <div>${provaveis}</div></div>` : ''}
      <label>Mascarar também estes nomes (um por linha)</label>
      <textarea ${dis} placeholder="Ex.: Maria da Silva" onchange="mudarNomes(${i.id}, this.value)">${esc(i.nomes)}</textarea>
      <pre>${realcarMarcas(i.masc.texto.slice(0, 5000))}${i.masc.texto.length > 5000 ? '\n\n… (mostrando os primeiros 5.000 de ' + i.masc.texto.length.toLocaleString('pt-BR') + ' caracteres)' : ''}</pre>
    </div>`;
}

function htmlItem(i) {
  const chip = { lendo: '<span class="etq azul"><span class="spinner"></span>Lendo…</span>', salvando: '<span class="etq azul"><span class="spinner"></span>Guardando…</span>',
    salvo: '<span class="etq verde">Guardado</span>', duplicado: '<span class="etq vermelho">Já estava na base</span>', erro: '<span class="etq vermelho">Não entrou</span>' }[i.estado]
    || (i.nivel === 'confirmar' ? '<span class="etq amarelo">Confira a unidade</span>' : '<span class="etq amarelo">Falta uma informação</span>');
  const topo = `<div class="item-topo"><div class="item-nome">${esc(i.nome)}<small>${i.tamanho ? Math.round(i.tamanho / 1024) + ' KB' : ''}</small></div>${chip}</div>`;
  if (i.estado === 'lendo') return topo;
  if (i.estado === 'erro' || i.estado === 'duplicado') return topo + `<div class="${i.estado === 'erro' ? 'erro' : 'aviso'}" style="margin-top:8px;">${esc(i.erro)}</div>` + `<div class="acoes"><button class="btn btn-sm btn-claro" onclick="descartar(${i.id})">Tirar da lista</button></div>`;
  if (i.estado === 'salvo') return topo + chipsDoItem(i) + `<div class="dica">${esc(i.resumoSalvo || 'Guardado.')}</div>` + (i.avisoOriginal ? `<div class="aviso">${esc(i.avisoOriginal)}</div>` : '');
  const c = i.campos, dis = i.estado === 'salvando' ? 'disabled' : '';
  const tipos = Object.keys((estado && estado.tipos) || {}).map(t => `<option value="${t}" ${c.tipo_doc === t ? 'selected' : ''}>${esc(estado.tipos[t])}</option>`).join('');
  let pergunta = '';
  if (!i.editando) {
    if (i.faltas && i.faltas.includes('tipo_doc')) pergunta += `<div><label>Que tipo de documento é?</label><select ${dis} onchange="mudarCampo(${i.id},'tipo_doc',this); avaliar(fila.find(x=>x.id===${i.id})); pintarItem(${i.id})"><option value="">Escolha…</option>${tipos}</select></div>`;
    if ((i.faltas && i.faltas.includes('unidade')) || i.nivel === 'confirmar') pergunta += `<div><label>${i.nivel === 'confirmar' ? 'O sistema achou esta unidade no texto. Está certo?' : 'De qual unidade é?'}</label><input ${dis} list="lista-unidades" value="${esc(c.unidade || '')}" oninput="mudarCampo(${i.id},'unidade',this); const it=fila.find(x=>x.id===${i.id}); it.origemUnidade='';" placeholder="Ex.: UPAE Goiana"></div>`;
  }
  return topo + chipsDoItem(i) +
    (i.editando ? camposCompletos(i) : (pergunta ? `<div class="pergunta">${pergunta}</div>` : '')) +
    (i.verMasc ? blocoProtegido(i) : '') +
    (i.b64 ? '' : '<div class="dica">Arquivo grande: só o texto mascarado vai para a base; o original não será guardado no Drive.</div>') +
    `<div class="acoes"><button class="btn btn-principal" ${dis} onclick="salvarItem(${i.id})"><i class="ti ti-device-floppy"></i> Guardar na base</button>
      <button class="btn btn-sm btn-claro" ${dis} onclick="alternar(${i.id},'editando')">${i.editando ? 'Fechar a edição' : 'Editar tudo'}</button>
      <button class="btn btn-sm btn-claro" ${dis} onclick="alternar(${i.id},'verMasc')">${i.verMasc ? 'Esconder o que foi protegido' : 'Ver o que foi protegido'}</button>
      <button class="btn btn-sm btn-claro" ${dis} onclick="descartar(${i.id})">Descartar</button><span class="dica" id="aviso-${i.id}"></span></div>`;
}
function alternar(id, k) { const i = fila.find(x => x.id === id); if (!i) return; i[k] = !i[k]; pintarItem(id); }

function pintarFila() {
  const el = $('fila'); if (!el) return;
  const lote = $('lote'); if (lote) lote.classList.toggle('hidden', !fila.some(i => i.estado === 'pronto'));
  if (!fila.length) { el.innerHTML = ''; return; }
  el.innerHTML = fila.map(i => `<div class="item ${i.estado}" id="item-${i.id}">${htmlItem(i)}</div>`).join('');
}
function pintarItem(id) {
  const i = fila.find(x => x.id === id), el = $('item-' + id); if (!i || !el) return;
  el.className = 'item ' + i.estado; el.innerHTML = htmlItem(i);
}
function mudarCampo(id, k, el) {
  const i = fila.find(x => x.id === id); if (!i) return;
  i.campos[k] = el.value; delete i.sug[k]; el.classList.remove('sug');
  if (k === 'unidade') i.origemUnidade = '';
  if (i.estado === 'pronto') { const antes = i.nivel; avaliar(i); if (antes !== i.nivel && k !== 'unidade') pintarItem(id); }
}
function mudarNomes(id, v) { const i = fila.find(x => x.id === id); if (!i) return; i.nomes = v; remascarar(i); pintarItem(id); }
function mascararNome(id, nome) { const i = fila.find(x => x.id === id); if (!i) return; i.nomes = (i.nomes ? i.nomes.trim() + '\n' : '') + nome; remascarar(i); pintarItem(id); }
function descartar(id) { fila = fila.filter(x => x.id !== id); pintarFila(); }
function aplicarLote() {
  const un = $('lote-unidade').value.trim(), co = $('lote-contrato').value.trim();
  if (!un && !co) { $('msg-lote').innerHTML = '<div class="aviso">Escreva a unidade e/ou o contrato para aplicar.</div>'; return; }
  let n = 0;
  fila.filter(i => i.estado === 'pronto').forEach(i => { if (un) { i.campos.unidade = un; delete i.sug.unidade; i.origemUnidade = ''; } if (co) { i.campos.contrato = co; delete i.sug.contrato; } avaliar(i); n++; });
  pintarFila(); $('msg-lote').innerHTML = `<div class="ok-msg">Aplicado a ${n} arquivo(s) que esperavam.</div>`;
}

function faltaNoItem(i) {
  const c = i.campos;
  if (!c.tipo_doc) return 'Escolha o tipo do documento.';
  if (ehContratual(c.tipo_doc) && !c.unidade.trim()) return 'Informe a unidade (contrato, aditivo e apostilamento são guardados por unidade).';
  if (c.vigencia_ini && c.vigencia_fim && c.vigencia_fim < c.vigencia_ini) return 'O fim da vigência está antes do início.';
  return '';
}
async function salvarItem(id) {
  const i = fila.find(x => x.id === id); if (!i || i.estado !== 'pronto') return;
  const falta = faltaNoItem(i);
  if (falta) { const a = $('aviso-' + id); if (a) { a.style.color = '#8e1628'; a.textContent = falta; } return false; }
  i.estado = 'salvando'; pintarItem(id);
  const c = i.campos;
  const r = await api('docs/enviar', { tipo_doc: c.tipo_doc, numero_doc: c.numero_doc, contrato: c.contrato, unidade: c.unidade, data_doc: c.data_doc, vigencia_ini: c.vigencia_ini,
    vigencia_fim: c.vigencia_fim, processo_sei: c.processo_sei, assunto: c.assunto, nome_arquivo: i.nome, hash: i.hash, texto: i.masc.texto, trocas_cliente: i.masc.trocas, original_b64: i.b64 }, 120000);
  if (r.ok) {
    i.estado = 'salvo'; i.texto = ''; i.b64 = ''; i.masc = { texto: '', trocas: 0, por_tipo: {} };
    i.resumoSalvo = `${r.trechos} trecho(s) · ${r.original_guardado ? 'original guardado no Drive' : 'só o texto (sem original no Drive)'}.`;
    i.avisoOriginal = r.original_guardado ? '' : (r.aviso_original || '');
    // atualiza o que o app já sabe, sem chamar o servidor: o próximo arquivo do mesmo contrato já sai com a unidade certa
    if (estado) {
      estado.unidades = estado.unidades || []; estado.contratos_unidades = estado.contratos_unidades || {};
      if (c.unidade && !estado.unidades.some(u => norm(u) === norm(c.unidade))) estado.unidades.push(c.unidade);
      const kc = (c.contrato || '').trim(); if (kc && c.unidade && !estado.contratos_unidades[kc]) estado.contratos_unidades[kc] = c.unidade;
      estado.total_documentos = (estado.total_documentos || 0) + 1;
      const dl = $('lista-unidades'); if (dl) dl.innerHTML = estado.unidades.map(u => `<option value="${esc(u)}">`).join('');
    }
  } else if (r.duplicado) { i.estado = 'duplicado'; i.erro = r.erro; i.texto = ''; i.b64 = ''; }
  else { i.estado = 'pronto'; pintarItem(id); const a = $('aviso-' + id); if (a) { a.style.color = '#8e1628'; a.textContent = r.erro || 'Não foi possível salvar.'; } return false; }
  pintarItem(id);
  return true;
}
async function salvarTodos() {
  const btn = $('btn-salvar-todos'); const prontos = fila.filter(i => i.estado === 'pronto');
  if (!prontos.length) { $('msg-lote').innerHTML = '<div class="aviso">Não há arquivos esperando.</div>'; return; }
  const semCampo = prontos.filter(i => faltaNoItem(i));
  btn.disabled = true; let ok = 0;
  for (const i of prontos) { if (faltaNoItem(i)) continue; if (!TOKEN) break; if (await salvarItem(i.id)) ok++; }
  btn.disabled = false;
  $('msg-lote').innerHTML = `<div class="${semCampo.length ? 'aviso' : 'ok-msg'}">${ok} arquivo(s) guardado(s).${semCampo.length ? ` ${semCampo.length} ficou(aram) de fora porque falta o tipo ou a unidade: responda nos cartões abaixo.` : ''}</div>`;
}

// ==================== TELA: BASE ====================
let _baseFiltro = { unidade: '', tipo_doc: '', q: '' };
async function telaBase() {
  const c = $('conteudo');
  if (!estado) await carregarEstado();
  const unid = ((estado && estado.unidades) || []).map(u => `<option ${_baseFiltro.unidade === u ? 'selected' : ''} value="${esc(u)}">${esc(u)}</option>`).join('');
  const tipos = Object.keys((estado && estado.tipos) || {}).map(t => `<option value="${t}" ${_baseFiltro.tipo_doc === t ? 'selected' : ''}>${esc(estado.tipos[t])}</option>`).join('');
  c.innerHTML = `<div class="bloco">
      <h2><i class="ti ti-search"></i> Pesquisar na base <small id="base-total"></small></h2>
      <div class="filtros">
        <div style="flex:2; min-width:260px;"><label>O que você quer saber? (palavras)</label><input id="b-q" value="${esc(_baseFiltro.q)}" placeholder="Ex.: repasse mensal, reajuste, prazo de vigência" onkeydown="if(event.key==='Enter') pesquisarBase()"></div>
        <div><label>Unidade</label><select id="b-unidade" onchange="pesquisarBase()"><option value="">Todas</option>${unid}</select></div>
        <div><label>Tipo</label><select id="b-tipo" onchange="pesquisarBase()"><option value="">Todos</option>${tipos}</select></div>
        <div><button class="btn btn-principal" onclick="pesquisarBase()"><i class="ti ti-search"></i> Pesquisar</button> <button class="btn btn-claro" onclick="limparBase()">Limpar</button></div>
      </div>
      <p class="dica">Em branco: lista os documentos. Com palavras: procura no texto de todos eles e mostra os trechos que mais combinam, dizendo o que foi consultado.</p>
    </div><div id="base-res"></div>`;
  pesquisarBase();
}
function limparBase() { _baseFiltro = { unidade: '', tipo_doc: '', q: '' }; telaBase(); }

function realcar(texto, palavras) {
  const plano = texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(), marcas = [];
  (palavras || []).forEach(p => { let i = -1; while ((i = plano.indexOf(p, i + 1)) > -1) marcas.push([i, i + p.length]); });
  marcas.sort((a, b) => a[0] - b[0]);
  const juntas = []; marcas.forEach(m => { const ult = juntas[juntas.length - 1]; if (ult && m[0] <= ult[1]) ult[1] = Math.max(ult[1], m[1]); else juntas.push(m.slice()); });
  let saida = '', pos = 0;
  juntas.forEach(([a, b]) => { saida += esc(texto.slice(pos, a)) + '<mark>' + esc(texto.slice(a, b)) + '</mark>'; pos = b; });
  return saida + esc(texto.slice(pos));
}
async function pesquisarBase() {
  _baseFiltro = { unidade: $('b-unidade').value, tipo_doc: $('b-tipo').value, q: $('b-q').value.trim() };
  const out = $('base-res'); out.innerHTML = carregando(_baseFiltro.q ? 'Procurando nos documentos...' : 'Listando...');
  if (_baseFiltro.q) {
    const r = await api('docs/buscar', _baseFiltro);
    if (!r.ok) { out.innerHTML = `<div class="erro">${esc(r.erro || 'Não foi possível pesquisar.')}</div>`; return; }
    $('base-total').textContent = '';
    if (!r.resultados.length) { out.innerHTML = `<div class="bloco"><div class="vazio">Nenhum trecho encontrado com essas palavras.</div><div class="consultei">Consultei ${r.consultei.documentos} documento(s), ${r.consultei.trechos} trecho(s).</div></div>`; return; }
    out.innerHTML = `<div class="consultei">Consultei ${r.consultei.documentos} documento(s) e ${r.consultei.trechos} trecho(s). Mostrando os ${r.resultados.length} que mais combinam. Palavras usadas: ${r.palavras.map(esc).join(', ')}.</div>` +
      r.resultados.map(x => `<div class="res"><h3>${esc(x.titulo || x.nome_arquivo)}</h3>
        <div class="meta">${esc(nomeTipo(x.tipo_doc))}${x.numero_doc ? ' ' + esc(x.numero_doc) : ''} · ${esc(x.unidade || 'sem unidade')}${x.contrato ? ' · contrato ' + esc(x.contrato) : ''} · ${fmtData(x.data_doc)} · arquivo: ${esc(x.nome_arquivo)}
        · <a href="#" onclick="abrirDocumento('${esc(x.doc_id)}'); return false;">abrir o documento</a></div>
        <p>${realcar(x.trecho, r.palavras)}</p></div>`).join('');
    return;
  }
  const r = await api('docs/listar', _baseFiltro);
  if (!r.ok) { out.innerHTML = `<div class="erro">${esc(r.erro || 'Não foi possível listar.')}</div>`; return; }
  $('base-total').textContent = r.total + ' documento(s)';
  if (!r.documentos.length) { out.innerHTML = `<div class="bloco"><div class="vazio">A base ainda não tem documentos${_baseFiltro.unidade || _baseFiltro.tipo_doc ? ' com esse filtro' : ''}. Use "Alimentar a base" para enviar os primeiros.</div></div>`; return; }
  out.innerHTML = `<div class="bloco"><div class="rolagem"><table class="tabela"><thead><tr><th>Tipo</th><th>Nº</th><th>Unidade</th><th>Contrato</th><th>Data</th><th>Arquivo</th><th>Enviado</th><th></th></tr></thead><tbody>` +
    r.documentos.map(d => `<tr class="clique" onclick="abrirDocumento('${esc(d.doc_id)}')"><td>${esc(nomeTipo(d.tipo_doc))}</td><td>${esc(d.numero_doc)}</td><td>${esc(d.unidade)}</td><td>${esc(d.contrato)}</td><td>${fmtData(d.data_doc)}</td>
      <td>${esc(d.nome_arquivo)}${d.situacao === 'sem_original' ? ' <span class="etq amarelo" title="Só o texto está na base; o arquivo original não foi guardado no Drive">sem original</span>' : ''}</td><td>${esc(d.enviado_por)}<br><span class="dica">${fmtDataHora(d.enviado_em)}</span></td>
      <td>${d.drive_url ? `<a href="${esc(d.drive_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Abrir o arquivo original no Drive"><i class="ti ti-external-link"></i></a>` : ''}</td></tr>`).join('') +
    `</tbody></table></div>${r.total > r.documentos.length ? `<p class="dica">Mostrando ${r.documentos.length} de ${r.total}. Use os filtros para chegar nos outros.</p>` : ''}</div>`;
}

async function abrirDocumento(id) {
  const fundo = document.createElement('div'); fundo.className = 'janela-fundo'; fundo.id = 'janela-doc';
  fundo.onclick = e => { if (e.target === fundo) fundo.remove(); };
  fundo.innerHTML = `<div class="janela">${carregando('Abrindo...')}</div>`; document.body.appendChild(fundo);
  const r = await api('docs/detalhe', { doc_id: id });
  const box = fundo.firstElementChild;
  if (!r.ok) { box.innerHTML = `<div class="erro">${esc(r.erro || 'Não foi possível abrir.')}</div><div class="acoes"><button class="btn" onclick="$('janela-doc').remove()">Fechar</button></div>`; return; }
  const d = r.documento, x = r.extraidos || {};
  const pode = d.enviado_por === (usuario && usuario.email) || (usuario && usuario.perfil === 'admin');
  const meta = [['Tipo', nomeTipo(d.tipo_doc)], ['Nº', d.numero_doc], ['Contrato', d.contrato], ['Unidade', d.unidade], ['Data', fmtData(d.data_doc)],
    ['Vigência', d.vigencia_ini || d.vigencia_fim ? fmtData(d.vigencia_ini) + ' a ' + fmtData(d.vigencia_fim) : ''], ['Processo SEI', d.processo_sei], ['Assunto', d.assunto],
    ['Arquivo', d.nome_arquivo], ['Enviado por', d.enviado_por + ' em ' + fmtDataHora(d.enviado_em)], ['Dados mascarados', d.trocas_mascara]].filter(m => m[1] !== '' && m[1] !== undefined);
  box.innerHTML = `<h2>${esc(nomeTipo(d.tipo_doc))}${d.numero_doc ? ' ' + esc(d.numero_doc) : ''} <small style="font-weight:400; color:var(--mudo)">${esc(d.unidade)}</small></h2>
    <div class="campos" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));">${meta.map(m => `<div><label>${esc(m[0])}</label><div style="font-size:.86rem;">${esc(m[1])}</div></div>`).join('')}</div>
    ${d.situacao === 'sem_original' ? `<div class="aviso">O arquivo original não foi guardado no Drive. Motivo: ${esc(d.observacao || 'não informado')}.</div>` : ''}
    ${(x.valores || []).length ? `<label>Valores citados</label><div class="vals">${x.valores.slice(0, 20).map(v => `<span class="val" title="${esc(v.contexto)}">${esc(v.valor)}</span>`).join('')}</div>` : ''}
    ${(x.datas || []).length ? `<label>Datas citadas</label><div class="vals">${x.datas.slice(0, 20).map(v => `<span class="val" title="${esc(v.contexto)}">${esc(v.valor)}</span>`).join('')}</div>` : ''}
    <details class="masc" open><summary>Texto guardado na base (mascarado) — ${r.trechos.length} trecho(s)${r.cortado ? ', mostrando o começo' : ''}</summary>
      <pre>${realcarMarcas(r.trechos.map(t => (t.titulo ? '## ' + t.titulo + '\n' : '') + t.texto).join('\n\n'))}</pre></details>
    <div class="acoes">${d.drive_url ? `<a class="btn" href="${esc(d.drive_url)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> Abrir o original no Drive</a>` : ''}
      ${pode ? `<button class="btn btn-perigo" onclick="removerDocumento('${esc(d.doc_id)}')"><i class="ti ti-trash"></i> Remover da base</button>` : ''}
      <button class="btn" style="margin-left:auto;" onclick="$('janela-doc').remove()">Fechar</button></div>`;
}
async function removerDocumento(id) {
  if (!confirm('Remover este documento da base? O texto sai das buscas. O arquivo original continua no Drive.')) return;
  const r = await api('docs/remover', { doc_id: id });
  if (!r.ok) { alert(r.erro || 'Não foi possível remover.'); return; }
  $('janela-doc')?.remove(); await carregarEstado(); if (abaAtual === 'base') telaBase();
}

// ==================== TELA: UNIDADES (linha do tempo + conferências) ====================
let _unidadeSel = '';
async function telaUnidades() {
  const c = $('conteudo');
  if (!estado) await carregarEstado();
  const lista = (estado && estado.unidades) || [];
  c.innerHTML = `<div class="bloco"><h2><i class="ti ti-timeline"></i> Linha do tempo da unidade <small>contrato, aditivos e o que o sistema conferiu sozinho</small></h2>
    <div class="filtros"><div style="min-width:280px;"><label>Unidade</label><select id="u-sel" onchange="mostrarUnidade(this.value)"><option value="">Escolha…</option>${lista.map(u => `<option ${u === _unidadeSel ? 'selected' : ''} value="${esc(u)}">${esc(u)}</option>`).join('')}</select></div></div>
    ${lista.length ? '' : '<div class="vazio">Ainda não há unidades na base. Elas aparecem quando você salvar o primeiro contrato ou aditivo.</div>'}</div><div id="u-res"></div>`;
  if (_unidadeSel && lista.includes(_unidadeSel)) mostrarUnidade(_unidadeSel);
}
async function mostrarUnidade(u) {
  _unidadeSel = u; const out = $('u-res'); if (!u) { out.innerHTML = ''; return; }
  out.innerHTML = carregando('Montando a linha do tempo...');
  const r = await api('docs/unidade', { unidade: u });
  if (!r.ok) { out.innerHTML = `<div class="erro">${esc(r.erro || 'Não foi possível carregar.')}</div>`; return; }
  const conf = r.conferencias.length ? r.conferencias.map(a => `<div class="achado ${a.gravidade}"><b>${esc(a.titulo)}</b><span>${esc(a.detalhe)}</span></div>`).join('') : '<div class="ok-msg">O sistema não achou nada fora de ordem nas regras de hoje (veja a aba Regras para saber o que ele confere).</div>';
  out.innerHTML = `<div class="bloco"><h2>O que conferir <small>${r.conferencias.length} ponto(s) · feito por código, não pela IA</small></h2>${conf}
      <p class="dica">Isto é indício para o analista olhar, não conclusão. Faltar um aditivo na lista pode ser só um arquivo que ainda não foi enviado.</p></div>
    <div class="bloco"><h2>Linha do tempo <small>${r.documentos.length} documento(s)</small></h2><div class="linha-tempo">` +
    r.documentos.map(d => `<div class="lt-item"><b>${esc(nomeTipo(d.tipo_doc))}${d.numero_doc ? ' ' + esc(d.numero_doc) : ''}</b> <span class="meta">${d.contrato ? '· contrato ' + esc(d.contrato) : ''} · ${fmtData(d.data_doc)}${d.vigencia_ini || d.vigencia_fim ? ' · vigência ' + fmtData(d.vigencia_ini) + ' a ' + fmtData(d.vigencia_fim) : ''}</span>
      <div class="meta">${esc(d.nome_arquivo)} ${d.drive_url ? `· <a href="${esc(d.drive_url)}" target="_blank" rel="noopener">original</a>` : ''} · <a href="#" onclick="abrirDocumento('${esc(d.doc_id)}'); return false;">abrir</a></div>
      ${d.valores.length ? `<div class="vals">${d.valores.map(v => `<span class="val" title="${esc(v.contexto)}">${esc(v.valor)}</span>`).join('')}</div>` : ''}</div>`).join('') + `</div></div>`;
}

// ==================== TELA: REGRAS ====================

  if (!estado) await carregarEstado();
  const rs = (estado && estado.regras) || [];
  $('conteudo').innerHTML = `<div class="bloco"><h2><i class="ti ti-list-check"></i> O que o sistema confere sozinho <small>por código, sem IA</small></h2>
    <p class="dica">Conta, data e sequência quem faz é o código, porque a IA erra conta. Estas são as regras de hoje:</p>
    <div class="rolagem"><table class="tabela" style="margin-top:8px;"><thead><tr><th>Regra</th><th>O que olha</th><th>Peso</th></tr></thead><tbody>${rs.map(r => `<tr><td><b>${esc(r.nome)}</b></td><td>${esc(r.faz)}</td><td><span class="etq ${r.gravidade === 'atencao' ? 'vermelho' : 'amarelo'}">${r.gravidade === 'atencao' ? 'Atenção' : 'Conferir'}</span></td></tr>`).join('')}</tbody></table></div></div>
    <div class="bloco"><h2>Ainda não faz <small>combinado, vem nas próximas versões</small></h2>
    <ul style="margin:8px 0 0 20px; font-size:.86rem; line-height:1.7;"><li>Comparar o valor do repasse entre um aditivo e o anterior.</li><li>Conferir leis e decretos federais, estaduais e municipais (precisa da base de normas).</li>
    <li>Leitura por OCR de PDF escaneado.</li><li>Pesquisar por sentido (hoje a pesquisa é por palavras).</li><li>Ligar o Perguntar e a análise do SEI Analista a esta base.</li></ul></div>
    <div class="bloco"><h2>Sobre os dados guardados</h2><p class="dica" style="font-size:.84rem;">A base guarda o <b>texto mascarado</b>. O arquivo original fica só na pasta do Drive, com as permissões do Drive. Cada envio e cada remoção ficam no registro de atividades da Gestão (sem o conteúdo). Nomes de pessoas não são mascarados sozinhos: o sistema sugere os que parecem nomes e você decide.</p></div>`;
}
